<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account | Student Learning</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <div class="brand">

                <div class="brand-logo">
                    TS
                </div>

                <h1>
                    Create Account
                </h1>

                <p>
                    Start learning online
                </p>

            </div>


            <form id="registerForm">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        id="name"
                        type="text"
                        autocomplete="name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        id="email"
                        type="email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        id="password"
                        type="password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        id="confirmPassword"
                        type="password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="primary-button"
                    id="registerButton"
                >
                    Create Account
                </button>

            </form>


            <div
                id="registerMessage"
                class="message"
            ></div>


            <p class="auth-footer">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </section>

    </main>


    <script src="js/config.js"></script>

    <script src="js/api.js"></script>


    <script>

        const form =
            document.getElementById(
                'registerForm'
            );

        const button =
            document.getElementById(
                'registerButton'
            );

        const message =
            document.getElementById(
                'registerMessage'
            );


        form.addEventListener(
            'submit',
            async function(event) {

                event.preventDefault();


                const name =
                    document.getElementById(
                        'name'
                    ).value.trim();


                const email =
                    document.getElementById(
                        'email'
                    ).value.trim();


                const password =
                    document.getElementById(
                        'password'
                    ).value;


                const confirmPassword =
                    document.getElementById(
                        'confirmPassword'
                    ).value;


                if (
                    password !==
                    confirmPassword
                ) {

                    message.textContent =
                        'Passwords do not match.';

                    return;
                }


                button.disabled = true;

                button.textContent =
                    'Creating account...';


                try {

                    const result =
                        await apiRequest({

                            action: 'register',

                            name: name,

                            email: email,

                            password: password

                        });


                    if (!result.success) {

                        message.textContent =
                            result.message;

                        button.disabled =
                            false;

                        button.textContent =
                            'Create Account';

                        return;
                    }


                    message.textContent =
                        'Account created. Redirecting...';


                    setTimeout(
                        function() {

                            window.location.href =
                                'login.html';

                        },
                        1000
                    );


                } catch (error) {

                    message.textContent =
                        'Unable to connect to server.';

                    button.disabled =
                        false;

                    button.textContent =
                        'Create Account';
                }

            }
        );

    </script>

</body>

</html>
