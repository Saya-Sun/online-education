<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Student Details | Admin
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        /* ============================================================
           Navigation
        ============================================================ */


        .logout-button {
            border: 0;
            border-radius: 9px;

            padding: 9px 15px;

            font-size: 13px;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                background 0.15s ease;
        }


        .logout-button {
            background: #f1f3f6;
            color: #505866;
        }


        .logout-button:hover {
            background: #e7e9ed;
            transform: translateY(-1px);
        }



        .topbar-nav {

            display: flex;

            align-items: center;

            gap: 12px;

        }


        .nav-button {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            padding: 9px 16px;

            border-radius: 8px;

            background: #ffffff;

            color: #1f2937;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;

        }


        .student-profile {

            display: grid;

            grid-template-columns:
                1fr 220px;

            gap: 20px;

            margin-bottom: 22px;

        }


        .profile-card,
        .balance-card,
        .section-card {

            border:
                1px solid #e5e8ee;

            border-radius: 18px;

            background: #ffffff;

            box-shadow:
                0 8px 28px
                rgba(20, 30, 50, .06);

        }


        .profile-card {

            padding: 25px;

        }


        .profile-top {

            display: flex;

            align-items: center;

            gap: 16px;

        }


        .profile-avatar {

            width: 58px;

            height: 58px;

            display: flex;

            align-items: center;

            justify-content: center;

            flex-shrink: 0;

            border-radius: 50%;

            background: #edf2ff;

            color: #4257c8;

            font-size: 20px;

            font-weight: 700;

        }


        .profile-name {

            margin: 0;

            color: #172033;

            font-size: 23px;

        }


        .profile-email {

            margin: 5px 0 0;

            color: #7b8496;

            font-size: 13px;

        }


        .profile-meta {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;

            margin-top: 25px;

        }


        .meta-item {

            padding: 13px;

            border-radius: 10px;

            background: #f7f8fa;

        }


        .meta-item span {

            display: block;

            margin-bottom: 5px;

            color: #8a92a3;

            font-size: 11px;

        }


        .meta-item strong {

            color: #344054;

            font-size: 13px;

        }


        .balance-card {

            padding: 25px;

        }


        .balance-label {

            display: block;

            color: #7b8496;

            font-size: 12px;

        }


        .balance-value {

            display: block;

            margin-top: 8px;

            color: #1c4fd7;

            font-size: 30px;

            line-height: 1;

        }


        .balance-unit {

            display: block;

            margin-top: 7px;

            color: #8a92a3;

            font-size: 12px;

        }


        .section-card {

            margin-bottom: 22px;

            overflow: hidden;

        }


        .section-header {

            padding: 20px 23px;

            border-bottom:
                1px solid #edf0f4;

        }


        .section-header h2 {

            margin: 0;

            color: #172033;

            font-size: 17px;

        }


        .section-header p {

            margin: 5px 0 0;

            color: #8a92a3;

            font-size: 12px;

        }


        .section-content {

            padding: 0;

        }


        .data-table-wrapper {

            overflow-x: auto;

        }


        .data-table {

            width: 100%;

            min-width: 700px;

            border-collapse: collapse;

        }


        .data-table th {

            padding: 13px 18px;

            background: #fafbfc;

            border-bottom:
                1px solid #edf0f4;

            color: #7b8496;

            font-size: 10px;

            text-align: left;

            text-transform: uppercase;

        }


        .data-table td {

            padding: 15px 18px;

            border-bottom:
                1px solid #edf0f4;

            color: #344054;

            font-size: 13px;

        }


        .data-table tr:last-child td {

            border-bottom: 0;

        }


        .status-badge {

            display: inline-flex;

            padding: 5px 9px;

            border-radius: 999px;

            font-size: 10px;

            font-weight: 700;

        }


        .status-active {

            background:
                rgba(24,128,80,.10);

            color: #17764c;

        }


        .status-expired,
        .status-rejected {

            background:
                rgba(192,57,43,.10);

            color: #b52f23;

        }


        .status-pending {

            background:
                rgba(230,161,0,.12);

            color: #9a6800;

        }


        .status-approved {

            background:
                rgba(24,128,80,.10);

            color: #17764c;

        }


        .positive {

            color: #188050;

            font-weight: 700;

        }


        .negative {

            color: #c0392b;

            font-weight: 700;

        }


        .empty-section {

            padding: 35px;

            text-align: center;

            color: #8a92a3;

            font-size: 13px;

        }


        .loading {

            min-height: 220px;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #7b8496;

        }


        .error-box {

            padding: 30px;

            border-radius: 15px;

            background: #fff5f5;

            color: #b42318;

            text-align: center;

        }


        @media (max-width: 750px) {

            .student-profile {

                grid-template-columns: 1fr;

            }


            .profile-meta {

                grid-template-columns:
                    1fr;

            }


            .topbar-nav {

                gap: 6px;

            }


            .nav-button {

                padding:
                    8px 10px;

                font-size: 12px;

            }

        }

    </style>

</head>


<body>


<header class="topbar">

    <div class="topbar-brand">

        Admin Panel

    </div>


    <nav class="topbar-nav">

        <a
            href="admin-students.html"
            class="nav-button"
        >
            ← Students
        </a>


        <a
            href="admin.html"
            class="nav-button"
        >
            Dashboard
        </a>


        <button
            class="logout-button"
            onclick="logout()"
        >
            Logout
        </button>

    </nav>

</header>



<main class="dashboard">


    <section class="welcome">

        <p>
            Administration
        </p>

        <h1>
            Student Details
        </h1>

    </section>



    <div id="content">

        <div class="loading">

            Loading student...

        </div>

    </div>


</main>



<script src="js/config.js"></script>

<script src="js/api.js"></script>

<script src="js/auth.js"></script>



<script>

/* ================================================================
   STUDENT DETAILS
   Created by Tr. Sun
   ================================================================ */


let studentData = null;



/* ================================================================
   GET STUDENT ID
   ================================================================ */

function getStudentId() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    return String(
        params.get('id') || ''
    ).trim();

}



/* ================================================================
   ESCAPE HTML
   ================================================================ */

function escapeHtml(value) {

    return String(
        value ?? ''
    )
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}



/* ================================================================
   FORMAT NUMBER
   ================================================================ */

function formatNumber(value) {

    return (
        Number(value) || 0
    ).toLocaleString();

}



/* ================================================================
   FORMAT DATE
   ================================================================ */

function formatDate(value) {

    if (!value) {

        return '—';

    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return '—';

    }


    return date.toLocaleString(
        undefined,
        {
            year: 'numeric',
            month: 'short',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
        }
    );

}



/* ================================================================
   INITIALS
   ================================================================ */

function getInitials(name) {

    const parts =
        String(
            name || '?'
        )
        .trim()
        .split(/\s+/);


    if (
        parts.length === 1
    ) {

        return parts[0]
            .substring(0, 2)
            .toUpperCase();

    }


    return (
        parts[0][0] +
        parts[parts.length - 1][0]
    ).toUpperCase();

}



/* ================================================================
   STATUS
   ================================================================ */

function statusHtml(status) {

    const value =
        String(
            status || ''
        )
        .trim()
        .toUpperCase();


    let className =
        'status-pending';


    if (
        value === 'ACTIVE' ||
        value === 'APPROVED'
    ) {

        className =
            value === 'ACTIVE'
                ? 'status-active'
                : 'status-approved';

    }
    else if (
        value === 'EXPIRED' ||
        value === 'REJECTED' ||
        value === 'INACTIVE' ||
        value === 'DISABLED'
    ) {

        className =
            value === 'EXPIRED'
                ? 'status-expired'
                : 'status-rejected';

    }


    return `

        <span
            class="status-badge ${className}"
        >

            ${escapeHtml(
                value || 'UNKNOWN'
            )}

        </span>

    `;

}



/* ================================================================
   RENDER PAGE
   ================================================================ */

function renderStudent() {

    const content =
        document.getElementById(
            'content'
        );


    const student =
        studentData.student;


    document.title =
        student.name +
        ' | Student Details';


    let subscriptionsHtml =
        '';


    if (
        !studentData.subscriptions ||
        studentData.subscriptions.length === 0
    ) {

        subscriptionsHtml = `

            <div class="empty-section">

                No subscriptions found.

            </div>

        `;

    }
    else {

        subscriptionsHtml = `

            <div class="data-table-wrapper">

                <table class="data-table">

                    <thead>

                        <tr>

                            <th>
                                Course
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                Start
                            </th>

                            <th>
                                End
                            </th>

                            <th>
                                Amount
                            </th>

                        </tr>

                    </thead>

                    <tbody>

        `;


        studentData.subscriptions.forEach(
            function(item) {

                subscriptionsHtml += `

                    <tr>

                        <td>

                            <strong>

                                ${escapeHtml(
                                    item.courseName
                                )}

                            </strong>

                            <br>

                            <small>

                                ${escapeHtml(
                                    item.courseId
                                )}

                            </small>

                        </td>

                        <td>

                            ${statusHtml(
                                item.status
                            )}

                        </td>

                        <td>

                            ${escapeHtml(
                                formatDate(
                                    item.startDate
                                )
                            )}

                        </td>

                        <td>

                            ${escapeHtml(
                                formatDate(
                                    item.endDate
                                )
                            )}

                        </td>

                        <td>

                            ${formatNumber(
                                item.amount
                            )}
                            credits

                        </td>

                    </tr>

                `;

            }
        );


        subscriptionsHtml += `

                    </tbody>

                </table>

            </div>

        `;

    }



    let transactionsHtml =
        '';


    if (
        !studentData.transactions ||
        studentData.transactions.length === 0
    ) {

        transactionsHtml = `

            <div class="empty-section">

                No credit transactions found.

            </div>

        `;

    }
    else {

        transactionsHtml = `

            <div class="data-table-wrapper">

                <table class="data-table">

                    <thead>

                        <tr>

                            <th>
                                Date
                            </th>

                            <th>
                                Type
                            </th>

                            <th>
                                Credits
                            </th>

                            <th>
                                Balance Before
                            </th>

                            <th>
                                Balance After
                            </th>

                            <th>
                                Description
                            </th>

                        </tr>

                    </thead>

                    <tbody>

        `;


        studentData.transactions
            .slice()
            .reverse()
            .forEach(
                function(item) {

                    const type =
                        String(
                            item.type || ''
                        )
                        .toUpperCase();


                    const positive =
                        type === 'TOPUP';


                    transactionsHtml += `

                        <tr>

                            <td>

                                ${escapeHtml(
                                    formatDate(
                                        item.createdAt
                                    )
                                )}

                            </td>

                            <td>

                                ${escapeHtml(
                                    item.type
                                )}

                            </td>

                            <td>

                                <span
                                    class="${
                                        positive
                                            ? 'positive'
                                            : 'negative'
                                    }"
                                >

                                    ${
                                        positive
                                            ? '+'
                                            : '-'
                                    }${formatNumber(
                                        item.amount
                                    )}

                                </span>

                            </td>

                            <td>

                                ${formatNumber(
                                    item.balanceBefore
                                )}

                            </td>

                            <td>

                                ${formatNumber(
                                    item.balanceAfter
                                )}

                            </td>

                            <td>

                                ${escapeHtml(
                                    item.description ||
                                    '—'
                                )}

                            </td>

                        </tr>

                    `;

                }
            );


        transactionsHtml += `

                    </tbody>

                </table>

            </div>

        `;

    }



    let paymentsHtml =
        '';


    if (
        !studentData.payments ||
        studentData.payments.length === 0
    ) {

        paymentsHtml = `

            <div class="empty-section">

                No payment history found.

            </div>

        `;

    }
    else {

        paymentsHtml = `

            <div class="data-table-wrapper">

                <table class="data-table">

                    <thead>

                        <tr>

                            <th>
                                Payment ID
                            </th>

                            <th>
                                Amount
                            </th>

                            <th>
                                Method
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                Submitted
                            </th>

                            <th>
                                Credits Added
                            </th>

                        </tr>

                    </thead>

                    <tbody>

        `;


        studentData.payments
            .slice()
            .reverse()
            .forEach(
                function(item) {

                    paymentsHtml += `

                        <tr>

                            <td>

                                <strong>

                                    ${escapeHtml(
                                        item.paymentId
                                    )}

                                </strong>

                            </td>

                            <td>

                                ${formatNumber(
                                    item.amount
                                )}
                                MMK

                            </td>

                            <td>

                                ${escapeHtml(
                                    item.paymentMethod ||
                                    '—'
                                )}

                            </td>

                            <td>

                                ${statusHtml(
                                    item.status
                                )}

                            </td>

                            <td>

                                ${escapeHtml(
                                    formatDate(
                                        item.submittedAt
                                    )
                                )}

                            </td>

                            <td>

                                ${formatNumber(
                                    item.creditsAdded
                                )}

                            </td>

                        </tr>

                    `;

                }
            );


        paymentsHtml += `

                    </tbody>

                </table>

            </div>

        `;

    }



    content.innerHTML = `

        <!-- ======================================================
             PROFILE
             ====================================================== -->

        <section class="student-profile">


            <div class="profile-card">


                <div class="profile-top">


                    <div
                        class="profile-avatar"
                    >

                        ${escapeHtml(
                            getInitials(
                                student.name
                            )
                        )}

                    </div>


                    <div>

                        <h2
                            class="profile-name"
                        >

                            ${escapeHtml(
                                student.name
                            )}

                        </h2>


                        <p
                            class="profile-email"
                        >

                            ${escapeHtml(
                                student.email
                            )}

                        </p>

                    </div>


                </div>


                <div class="profile-meta">


                    <div class="meta-item">

                        <span>
                            Student ID
                        </span>

                        <strong>
                            ${escapeHtml(
                                student.userId
                            )}
                        </strong>

                    </div>


                    <div class="meta-item">

                        <span>
                            Status
                        </span>

                        <strong>

                            ${statusHtml(
                                student.status
                            )}

                        </strong>

                    </div>


                    <div class="meta-item">

                        <span>
                            Created
                        </span>

                        <strong>

                            ${escapeHtml(
                                formatDate(
                                    student.createdAt
                                )
                            )}

                        </strong>

                    </div>


                    <div class="meta-item">

                        <span>
                            Last Login
                        </span>

                        <strong>

                            ${escapeHtml(
                                formatDate(
                                    student.lastLogin
                                )
                            )}

                        </strong>

                    </div>


                </div>


            </div>


            <div class="balance-card">


                <span class="balance-label">

                    Credit Balance

                </span>


                <strong
                    class="balance-value"
                >

                    ${formatNumber(
                        student.creditBalance
                    )}

                </strong>


                <span class="balance-unit">

                    Credits

                </span>


            </div>


        </section>



        <!-- ======================================================
             SUBSCRIPTIONS
             ====================================================== -->

        <section class="section-card">


            <div class="section-header">

                <h2>
                    Subscriptions
                </h2>

                <p>
                    Student course subscriptions
                </p>

            </div>


            <div class="section-content">

                ${subscriptionsHtml}

            </div>


        </section>



        <!-- ======================================================
             CREDIT TRANSACTIONS
             ====================================================== -->

        <section class="section-card">


            <div class="section-header">

                <h2>
                    Credit Transactions
                </h2>

                <p>
                    Complete credit activity
                </p>

            </div>


            <div class="section-content">

                ${transactionsHtml}

            </div>


        </section>



        <!-- ======================================================
             PAYMENTS
             ====================================================== -->

        <section class="section-card">


            <div class="section-header">

                <h2>
                    Payment History
                </h2>

                <p>
                    Student top-up payment records
                </p>

            </div>


            <div class="section-content">

                ${paymentsHtml}

            </div>


        </section>

    `;

}



/* ================================================================
   LOAD STUDENT
   ================================================================ */

async function loadStudent() {

    const studentId =
        getStudentId();


    if (!studentId) {

        document.getElementById(
            'content'
        ).innerHTML = `

            <div class="error-box">

                Student ID is missing.

            </div>

        `;

        return;

    }


    try {

        const result =
            await apiRequest({

                action:
                    'getAdminStudentDetails',

                token:
                    getAuthToken(),

                studentId:
                    studentId

            });


        if (
            !result ||
            !result.success
        ) {

            document.getElementById(
                'content'
            ).innerHTML = `

                <div class="error-box">

                    ${
                        escapeHtml(
                            result?.message ||
                            'Unable to load student.'
                        )
                    }

                </div>

            `;

            return;

        }


        studentData =
            result;


        renderStudent();


    } catch (error) {

        console.error(
            'Load student error:',
            error
        );


        document.getElementById(
            'content'
        ).innerHTML = `

            <div class="error-box">

                Unable to load student details.

            </div>

        `;

    }

}



/* ================================================================
   INITIALIZE
   ================================================================ */

async function initialize() {

    const user =
        await requireLogin();


    if (!user) {

        return;

    }


    if (
        String(
            user.role || ''
        )
        .trim()
        .toUpperCase() !==
        'ADMIN'
    ) {

        window.location.href =
            'dashboard.html';

        return;

    }


    await loadStudent();

}


initialize();

</script>


</body>

</html>
