<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Courses | Admin
    </title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        /* ============================================================
           Navigation
           ============================================================ */

        .topbar-nav {

            display: flex;

            align-items: center;

            gap: 10px;

        }


        .nav-button {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            padding: 9px 15px;

            border-radius: 8px;

            background: #ffffff;

            color: #172033;

            text-decoration: none;

            font-size: 13px;

            font-weight: 600;

            transition:
                background .2s ease,
                transform .2s ease;

        }


        .nav-button:hover {

            background: #f1f3f6;

            transform:
                translateY(-1px);

        }

        .dashboard-button,
        .logout-button {
            border: 0;
            border-radius: 9px;

            padding: 9px 15px;

            font-size: 13px;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                background 0.15s ease;
        }


        .dashboard-button {
            background: #eef2ff;
            color: #4654b8;
        }


        .dashboard-button:hover {
            background: #e4e9ff;
            transform: translateY(-1px);
        }


        .logout-button {
            background: #f1f3f6;
            color: #505866;
        }


        .logout-button:hover {
            background: #e7e9ed;
            transform: translateY(-1px);
        }




        /* ============================================================
           HEADER
           ============================================================ */

        .courses-header {

            display: flex;

            align-items: flex-end;

            justify-content: space-between;

            gap: 20px;

            margin-bottom: 24px;

        }


        .courses-header .welcome {

            margin-bottom: 0;

        }


        .courses-count {

            padding-bottom: 8px;

            color: #7b8496;

            font-size: 13px;

        }


        /* ============================================================
           TOOLBAR
           ============================================================ */

        .courses-toolbar {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            margin-bottom: 18px;

        }


        .search-box {

            position: relative;

            width: min(460px, 100%);

        }


        .search-box input {

            width: 100%;

            height: 46px;

            padding:
                0 16px 0 43px;

            border:
                1px solid #dfe4eb;

            border-radius: 10px;

            outline: none;

            background: #ffffff;

            color: #172033;

            font-family: inherit;

            font-size: 14px;

        }


        .search-box input:focus {

            border-color: #7385dc;

            box-shadow:
                0 0 0 3px rgba(115, 133, 220, .12);

        }


        .search-icon {

            position: absolute;

            left: 15px;

            top: 50%;

            transform:
                translateY(-50%);

            color: #8a92a3;

            pointer-events: none;

        }


        .status-filter {

            height: 46px;

            padding:
                0 14px;

            border:
                1px solid #dfe4eb;

            border-radius: 10px;

            outline: none;

            background: #ffffff;

            color: #344054;

            font-family: inherit;

            font-size: 13px;

        }


        /* ============================================================
           COURSE GRID
           ============================================================ */

        .courses-grid {

            display: grid;

            grid-template-columns:
                repeat(auto-fill,
                    minmax(280px, 1fr));

            gap: 20px;

        }


        /* ============================================================
           COURSE CARD
           ============================================================ */

        .course-card {

            overflow: hidden;

            border:
                1px solid #e5e8ee;

            border-radius: 18px;

            background: #ffffff;

            box-shadow:
                0 8px 28px rgba(20, 30, 50, .06);

            transition:
                transform .2s ease,
                box-shadow .2s ease;

        }


        .course-card:hover {

            transform:
                translateY(-3px);

            box-shadow:
                0 14px 35px rgba(20, 30, 50, .10);

        }


        /* ============================================================
           COURSE IMAGE
           ============================================================ */

        .course-image-wrapper {

            position: relative;

            width: 100%;

            height: 175px;

            overflow: hidden;

            background:
                linear-gradient(135deg,
                    #eef2ff,
                    #f6f7fb);

        }


        .course-image {

            width: 100%;

            height: 100%;

            display: block;

            object-fit: cover;

        }


        .course-image-placeholder {

            width: 100%;

            height: 100%;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #8a92a3;

            font-size: 40px;

        }


        .course-status {

            position: absolute;

            top: 12px;

            right: 12px;

        }


        /* ============================================================
           STATUS
           ============================================================ */

        .status-badge {

            display: inline-flex;

            align-items: center;

            gap: 6px;

            padding:
                6px 10px;

            border-radius: 999px;

            font-size: 10px;

            font-weight: 700;

        }


        .status-dot {

            width: 6px;

            height: 6px;

            border-radius: 50%;

        }


        .status-active {

            background:
                rgba(24, 128, 80, .95);

            color: #ffffff;

        }


        .status-active .status-dot {

            background: #ffffff;

        }


        .status-inactive {

            background:
                rgba(192, 57, 43, .95);

            color: #ffffff;

        }


        .status-inactive .status-dot {

            background: #ffffff;

        }


        .status-other {

            background:
                rgba(80, 90, 110, .90);

            color: #ffffff;

        }


        .status-other .status-dot {

            background: #ffffff;

        }


        /* ============================================================
           COURSE CONTENT
           ============================================================ */

        .course-content {

            padding: 20px;

        }


        .course-id {

            display: block;

            margin-bottom: 6px;

            color: #8a92a3;

            font-family:
                monospace;

            font-size: 10px;

        }


        .course-name {

            margin: 0;

            color: #172033;

            font-size: 18px;

            line-height: 1.35;

        }


        .course-description {

            display: -webkit-box;

            margin:
                9px 0 18px;

            overflow: hidden;

            color: #7b8496;

            font-size: 13px;

            line-height: 1.6;

            -webkit-box-orient: vertical;

            -webkit-line-clamp: 3;

        }


        /* ============================================================
           COURSE FOOTER
           ============================================================ */

        .course-footer {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 12px;

            padding-top: 16px;

            border-top:
                1px solid #edf0f4;

        }


        .course-fee-label {

            display: block;

            color: #8a92a3;

            font-size: 10px;

        }


        .course-fee {

            display: block;

            margin-top: 3px;

            color: #1c4fd7;

            font-size: 17px;

            font-weight: 700;

        }


        .course-fee-unit {

            color: #8a92a3;

            font-size: 10px;

        }


        .view-button {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            padding:
                9px 13px;

            border-radius: 8px;

            background: #172033;

            color: #ffffff;

            text-decoration: none;

            font-size: 11px;

            font-weight: 700;

            transition:
                background .2s ease,
                transform .2s ease;

        }


        .view-button:hover {

            background: #25314a;

            transform:
                translateY(-1px);

        }


        /* ============================================================
           EMPTY / LOADING
           ============================================================ */

        .empty-state {

            min-height: 230px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            padding: 40px;

            text-align: center;

        }


        .empty-state-icon {

            width: 48px;

            height: 48px;

            display: flex;

            align-items: center;

            justify-content: center;

            margin-bottom: 14px;

            border-radius: 14px;

            background: #f1f3f7;

            color: #7b8496;

            font-size: 20px;

        }


        .empty-state strong {

            color: #4d576a;

            font-size: 16px;

        }


        .empty-state span {

            max-width: 450px;

            margin-top: 7px;

            color: #8a92a3;

            font-size: 13px;

            line-height: 1.6;

        }


        .loading {

            min-height: 230px;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #7b8496;

            font-size: 14px;

        }


        /* ============================================================
           RESPONSIVE
           ============================================================ */

        @media (max-width: 750px) {

            .courses-header {

                align-items: flex-start;

                flex-direction: column;

                gap: 6px;

            }


            .courses-count {

                padding-bottom: 0;

            }


            .courses-toolbar {

                align-items: stretch;

                flex-direction: column;

            }


            .search-box {

                width: 100%;

            }


            .status-filter {

                width: 100%;

            }

        }


        @media (max-width: 550px) {

            .topbar {

                flex-wrap: wrap;

            }


            .topbar-nav {

                width: 100%;

                justify-content: flex-end;

            }


            .nav-button {

                padding:
                    8px 10px;

                font-size: 11px;

            }


            .courses-grid {

                grid-template-columns: 1fr;

            }

        }
    </style>

</head>


<body>


    <!-- ================================================================
     TOP BAR
     ================================================================ -->

    <header class="topbar">


        <div class="topbar-brand">

            Admin Panel

        </div>


        <nav class="topbar-nav">


            <a href="admin.html" class="nav-button">

                ← Admin Dashboard

            </a>


            <button type="button" class="logout-button" onclick="logout()">

                Logout

            </button>


        </nav>


    </header>



    <!-- ================================================================
     MAIN
     ================================================================ -->

    <main class="dashboard">


        <section class="courses-header">


            <div class="welcome">


                <p>
                    Administration
                </p>


                <h1>
                    Courses
                </h1>


            </div>


            <span id="coursesCount" class="courses-count">

                Loading...

            </span>


        </section>



        <!-- ============================================================
         TOOLBAR
         ============================================================ -->

        <section class="courses-toolbar">


            <div class="search-box">


                <span class="search-icon">
                    🔍
                </span>


                <input type="search" id="courseSearch" placeholder="Search courses..." autocomplete="off">


            </div>


            <select id="statusFilter" class="status-filter">

                <option value="ALL">
                    All Statuses
                </option>

                <option value="ACTIVE">
                    Active
                </option>

                <option value="INACTIVE">
                    Inactive
                </option>

            </select>


        </section>



        <!-- ============================================================
         MESSAGE
         ============================================================ -->

        <div id="message" class="message"></div>



        <!-- ============================================================
         COURSES
         ============================================================ -->

        <section id="courses" class="courses-grid">


            <div class="loading">

                Loading courses...

            </div>


        </section>


    </main>



    <!-- ================================================================
     JAVASCRIPT FILES
     ================================================================ -->

    <script src="js/config.js"></script>

    <script src="js/api.js"></script>

    <script src="js/auth.js"></script>



    <script>

        /* ================================================================
           ADMIN COURSES
           Created by Tr. Sun
           ================================================================ */


        let courses = [];



        /* ================================================================
           FORMAT NUMBER
           ================================================================ */

        function formatNumber(value) {

            return (
                Number(value) || 0
            ).toLocaleString();

        }



        /* ================================================================
           ESCAPE HTML
           ================================================================ */

        function escapeHtml(value) {

            return String(
                value ?? ''
            )
                .replace(
                    /&/g,
                    '&amp;'
                )
                .replace(
                    /</g,
                    '&lt;'
                )
                .replace(
                    />/g,
                    '&gt;'
                )
                .replace(
                    /"/g,
                    '&quot;'
                )
                .replace(
                    /'/g,
                    '&#039;'
                );

        }



        /* ================================================================
           STATUS HTML
           ================================================================ */

        function statusHtml(status) {

            const value =
                String(
                    status || ''
                )
                    .trim()
                    .toUpperCase();


            let className =
                'status-other';


            if (
                value === 'ACTIVE'
            ) {

                className =
                    'status-active';

            }
            else if (
                value === 'INACTIVE' ||
                value === 'DISABLED'
            ) {

                className =
                    'status-inactive';

            }


            return `

        <span
            class="status-badge ${className}"
        >

            <span
                class="status-dot"
            ></span>

            ${escapeHtml(
                value || 'UNKNOWN'
            )}

        </span>

    `;

        }



        /* ================================================================
           IMAGE URL
           ================================================================ */

        function getCourseImageUrl(
            course
        ) {

            const value =
                String(
                    course.courseImage ||
                    course.CourseImage ||
                    ''
                ).trim();


            if (!value) {

                return '';

            }


            /*
             * Google Drive file ID
             */

            if (
                /^[a-zA-Z0-9_-]{20,}$/.test(
                    value
                )
            ) {

                return (
                    'https://drive.google.com/thumbnail?id=' +
                    encodeURIComponent(
                        value
                    ) +
                    '&sz=w1000'
                );

            }


            /*
             * Already a URL or relative path
             */

            return value;

        }



        /* ================================================================
           LOAD COURSES
           ================================================================ */

        async function loadCourses() {

            const container =
                document.getElementById(
                    'courses'
                );


            container.innerHTML = `

        <div class="loading">

            Loading courses...

        </div>

    `;


            try {

                const result =
                    await apiRequest({

                        action:
                            'getAdminCourses',

                        token:
                            getAuthToken()

                    });


                if (
                    !result ||
                    !result.success
                ) {

                    updateCount(0);


                    container.innerHTML = `

                <div class="empty-state">

                    <div
                        class="empty-state-icon"
                    >
                        !
                    </div>

                    <strong>
                        Unable to load courses
                    </strong>

                    <span>
                        ${escapeHtml(
                        result?.message ||
                        'Please try again.'
                    )
                        }
                    </span>

                </div>

            `;

                    return;

                }


                courses =
                    Array.isArray(
                        result.courses
                    )
                        ? result.courses
                        : [];


                updateCount(
                    courses.length
                );


                renderCourses(
                    courses
                );


            } catch (error) {

                console.error(
                    'Load courses error:',
                    error
                );


                updateCount(0);


                container.innerHTML = `

            <div class="empty-state">

                <div
                    class="empty-state-icon"
                >
                    !
                </div>

                <strong>
                    Unable to load courses
                </strong>

                <span>
                    Please refresh the page and try again.
                </span>

            </div>

        `;

            }

        }



        /* ================================================================
           UPDATE COUNT
           ================================================================ */

        function updateCount(
            count
        ) {

            document.getElementById(
                'coursesCount'
            ).textContent =
                count +
                (
                    count === 1
                        ? ' course'
                        : ' courses'
                );

        }



        /* ================================================================
           FILTER COURSES
           ================================================================ */

        function getFilteredCourses() {

            const query =
                String(
                    document.getElementById(
                        'courseSearch'
                    ).value || ''
                )
                    .trim()
                    .toLowerCase();


            const status =
                String(
                    document.getElementById(
                        'statusFilter'
                    ).value || 'ALL'
                )
                    .toUpperCase();


            return courses.filter(
                function (course) {

                    const searchable = [

                        course.courseId,

                        course.CourseID,

                        course.courseName,

                        course.CourseName,

                        course.description,

                        course.Description,

                        course.status,

                        course.Status

                    ]
                        .map(
                            function (value) {

                                return String(
                                    value || ''
                                )
                                    .toLowerCase();

                            }
                        )
                        .join(' ');


                    const matchesSearch =
                        !query ||
                        searchable.includes(
                            query
                        );


                    const courseStatus =
                        String(
                            course.status ||
                            course.Status ||
                            ''
                        )
                            .trim()
                            .toUpperCase();


                    const matchesStatus =
                        status === 'ALL' ||
                        courseStatus === status;


                    return (
                        matchesSearch &&
                        matchesStatus
                    );

                }
            );

        }



        /* ================================================================
           RENDER COURSES
           ================================================================ */

        function renderCourses(
            list
        ) {

            const container =
                document.getElementById(
                    'courses'
                );


            if (
                !Array.isArray(list) ||
                list.length === 0
            ) {

                container.innerHTML = `

            <div class="empty-state">

                <div
                    class="empty-state-icon"
                >
                    📚
                </div>

                <strong>
                    No courses found
                </strong>

                <span>
                    There are no courses matching your current search or filter.
                </span>

            </div>

        `;

                return;

            }


            container.innerHTML =
                '';


            list.forEach(
                function (course) {

                    const card =
                        document.createElement(
                            'article'
                        );


                    card.className =
                        'course-card';


                    const courseId =
                        course.courseId ||
                        course.CourseID ||
                        '';


                    const courseName =
                        course.courseName ||
                        course.CourseName ||
                        'Untitled Course';


                    const description =
                        course.description ||
                        course.Description ||
                        '';


                    const monthlyFee =
                        Number(
                            course.monthlyFee ??
                            course.MonthlyFee ??
                            0
                        ) || 0;


                    const status =
                        course.status ||
                        course.Status ||
                        '';


                    const imageUrl =
                        getCourseImageUrl(
                            course
                        );


                    const imageHtml =
                        imageUrl

                            ? `

                        <img
                            class="course-image"
                            src="${escapeHtml(
                                imageUrl
                            )}"
                            alt="${escapeHtml(
                                courseName
                            )}"
                            loading="lazy"
                            onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                        >

                        <div
                            class="course-image-placeholder"
                            style="display:none;"
                        >
                            📚
                        </div>

                    `

                            : `

                        <div
                            class="course-image-placeholder"
                        >
                            📚
                        </div>

                    `;


                    card.innerHTML = `

                <!-- ==================================================
                     IMAGE
                     ================================================== -->

                <div
                    class="course-image-wrapper"
                >

                    ${imageHtml}


                    <div
                        class="course-status"
                    >

                        ${statusHtml(
                        status
                    )}

                    </div>

                </div>



                <!-- ==================================================
                     CONTENT
                     ================================================== -->

                <div
                    class="course-content"
                >


                    <span
                        class="course-id"
                    >

                        ${escapeHtml(
                        courseId
                    )}

                    </span>


                    <h2
                        class="course-name"
                    >

                        ${escapeHtml(
                        courseName
                    )}

                    </h2>


                    <p
                        class="course-description"
                    >

                        ${escapeHtml(
                        description ||
                        'No course description available.'
                    )}

                    </p>



                    <!-- ==============================================
                         FOOTER
                         ============================================== -->

                    <div
                        class="course-footer"
                    >


                        <div>


                            <span
                                class="course-fee-label"
                            >

                                Monthly Fee

                            </span>


                            <strong
                                class="course-fee"
                            >

                                ${formatNumber(
                        monthlyFee
                    )}

                            </strong>


                            <span
                                class="course-fee-unit"
                            >

                                credits

                            </span>


                        </div>


                        <a
                             href="admin-course.html?id=${encodeURIComponent(course.courseId)}"
                            class="view-button"
                        >

                            View Course

                        </a>


                    </div>


                </div>

            `;


                    container.appendChild(
                        card
                    );

                }
            );

        }



        /* ================================================================
           APPLY FILTERS
           ================================================================ */

        function applyFilters() {

            const filtered =
                getFilteredCourses();


            updateCount(
                filtered.length
            );


            renderCourses(
                filtered
            );

        }



        /* ================================================================
           SEARCH
           ================================================================ */

        document.getElementById(
            'courseSearch'
        )
            .addEventListener(
                'input',
                applyFilters
            );



        /* ================================================================
           STATUS FILTER
           ================================================================ */

        document.getElementById(
            'statusFilter'
        )
            .addEventListener(
                'change',
                applyFilters
            );



        /* ================================================================
           INITIALIZE
           ================================================================ */

        async function initialize() {

            try {

                const user =
                    await requireLogin();


                if (!user) {

                    return;

                }


                if (
                    String(
                        user.role || ''
                    )
                        .trim()
                        .toUpperCase() !==
                    'ADMIN'
                ) {

                    window.location.href =
                        'dashboard.html';

                    return;

                }


                await loadCourses();


            } catch (error) {

                console.error(
                    'Initialize courses error:',
                    error
                );


                document.getElementById(
                    'courses'
                ).innerHTML = `

            <div class="empty-state">

                <div
                    class="empty-state-icon"
                >
                    !
                </div>

                <strong>
                    Unable to initialize page
                </strong>

                <span>
                    Please refresh the page and try again.
                </span>

            </div>

        `;

            }

        }



        /* ================================================================
           START
           ================================================================ */

        initialize();

    </script>


</body>

</html>
