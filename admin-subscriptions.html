<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Subscriptions | Admin</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        /* ============================================================
           TOPBAR
           ============================================================ */

        .topbar-nav {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 38px;
            padding: 0 14px;
            border-radius: 9px;
            background: #ffffff;
            color: #172033;
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
        }

        .nav-button:hover {
            background: #f1f3f6;
        }

        .logout-button {
            min-height: 38px;
            padding: 0 14px;
            border: 0;
            border-radius: 9px;
            background: #f1f3f6;
            color: #505866;
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .logout-button:hover {
            background: #e7e9ed;
        }


        /* ============================================================
           PAGE HEADER
           ============================================================ */

        .subscriptions-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 22px;
        }

        .subscriptions-count {
            padding-bottom: 8px;
            color: #7b8496;
            font-size: 12px;
        }


        /* ============================================================
           TOOLBAR
           ============================================================ */

        .subscriptions-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 18px;
        }

        .search-box {
            position: relative;
            width: min(480px, 100%);
        }

        .search-box input {
            width: 100%;
            height: 44px;
            box-sizing: border-box;
            padding: 0 15px 0 42px;

            border: 1px solid #dfe4eb;
            border-radius: 10px;

            outline: none;
            background: #ffffff;
            color: #172033;

            font-family: inherit;
            font-size: 13px;
        }

        .search-box input:focus {
            border-color: #7385dc;
            box-shadow:
                0 0 0 3px rgba(115, 133, 220, .12);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #8a92a3;
            font-size: 14px;
            pointer-events: none;
        }

        .status-filter {
            height: 44px;
            min-width: 150px;
            padding: 0 13px;

            border: 1px solid #dfe4eb;
            border-radius: 10px;

            outline: none;
            background: #ffffff;
            color: #344054;

            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
        }


        /* ============================================================
           MESSAGE
           ============================================================ */

        .message {
            min-height: 0;
            margin-bottom: 15px;
            border-radius: 10px;
            font-size: 12px;
            line-height: 1.5;
        }

        .message:not(:empty) {
            padding: 11px 14px;
        }

        .message.success {
            background: #edf9f2;
            color: #17764c;
        }

        .message.error {
            background: #fff1f0;
            color: #b52f23;
        }

        .message.info {
            background: #eef4ff;
            color: #3157a4;
        }


        /* ============================================================
           TABLE CARD
           ============================================================ */

        .subscriptions-card {
            width: 100%;
            overflow: hidden;

            border: 1px solid #e5e8ee;
            border-radius: 17px;

            background: #ffffff;

            box-shadow:
                0 8px 28px rgba(20, 30, 50, .06);
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
        }


        /* ============================================================
           TABLE
           ============================================================ */

        .subscriptions-table {
            width: 100%;
            min-width: 1050px;
            border-collapse: collapse;
            table-layout: auto;
        }

        .subscriptions-table th {
            padding: 13px 14px;

            border-bottom: 1px solid #e9edf2;

            background: #fafbfc;

            color: #687386;

            font-size: 10px;
            font-weight: 700;

            text-align: left;
            text-transform: uppercase;

            letter-spacing: .04em;
            white-space: nowrap;
        }

        .subscriptions-table td {
            padding: 14px;

            border-bottom: 1px solid #edf0f4;

            color: #344054;

            font-size: 12px;

            vertical-align: middle;
        }

        .subscriptions-table tbody tr:last-child td {
            border-bottom: 0;
        }

        .subscriptions-table tbody tr:hover {
            background: #fafbfc;
        }


        /* ============================================================
           ACTION COLUMN
           ============================================================ */

        .subscriptions-table th:last-child,
        .subscriptions-table td:last-child {
            width: 125px;
            min-width: 125px;
            max-width: 125px;

            padding-left: 10px;
            padding-right: 10px;

            text-align: center;
            white-space: nowrap;
        }


        /* ============================================================
           SUBSCRIPTION ID
           ============================================================ */

        .subscription-id {
            color: #667085;
            font-family: monospace;
            font-size: 10px;
            white-space: nowrap;
        }


        /* ============================================================
           STUDENT
           ============================================================ */

        .student-cell {
            display: flex;
            align-items: center;
            gap: 9px;
            min-width: 160px;
        }

        .student-avatar {
            width: 34px;
            height: 34px;

            display: flex;
            align-items: center;
            justify-content: center;

            flex-shrink: 0;

            border-radius: 50%;

            background: #edf2ff;
            color: #4257c8;

            font-size: 10px;
            font-weight: 700;
        }

        .student-name {
            display: block;

            max-width: 150px;
            overflow: hidden;

            color: #172033;

            font-size: 12px;
            font-weight: 700;

            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .student-id {
            display: block;

            margin-top: 2px;

            color: #8a92a3;

            font-family: monospace;
            font-size: 9px;
        }


        /* ============================================================
           COURSE
           ============================================================ */

        .course-name {
            display: block;

            max-width: 180px;
            overflow: hidden;

            color: #172033;

            font-size: 12px;
            font-weight: 700;

            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .course-id {
            display: block;

            margin-top: 3px;

            color: #98a2b3;

            font-family: monospace;
            font-size: 9px;
        }


        /* ============================================================
           DATE
           ============================================================ */

        .date-text {
            color: #526078;
            white-space: nowrap;
        }

        .date-expired {
            color: #c0392b;
            font-weight: 700;
            white-space: nowrap;
        }


        /* ============================================================
           FEE
           ============================================================ */

        .fee {
            color: #1c4fd7;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
        }

        .fee-unit {
            margin-left: 2px;
            color: #8a92a3;
            font-size: 9px;
        }


        /* ============================================================
           STATUS BADGES
           ============================================================ */

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;

            padding: 6px 9px;

            border-radius: 999px;

            font-size: 9px;
            font-weight: 700;

            white-space: nowrap;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .status-active {
            background: rgba(24, 128, 80, .10);
            color: #17764c;
        }

        .status-active .status-dot {
            background: #188050;
        }

        .status-expired {
            background: rgba(192, 57, 43, .10);
            color: #b52f23;
        }

        .status-expired .status-dot {
            background: #c0392b;
        }

        .status-other {
            background: #eef1f5;
            color: #667085;
        }

        .status-other .status-dot {
            background: #98a2b3;
        }


        /* ============================================================
           UPDATE STATUS BUTTON
           ============================================================ */

        .status-update-button {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            width: 108px;
            min-width: 108px;
            height: 33px;

            box-sizing: border-box;

            padding: 0 8px;

            border: 0;
            border-radius: 8px;

            background: #172033;
            color: #ffffff;

            font-family: inherit;
            font-size: 9px;
            font-weight: 700;

            cursor: pointer;
            white-space: nowrap;

            transition:
                background .2s ease,
                transform .15s ease,
                opacity .2s ease;
        }

        .status-update-button:hover {
            background: #29354c;
            transform: translateY(-1px);
        }

        .status-update-button:active {
            transform: translateY(0);
        }

        .status-update-button:disabled {
            opacity: .55;
            cursor: wait;
            transform: none;
        }


        /* ============================================================
           LOADING
           ============================================================ */

        .loading {
            min-height: 240px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #7b8496;
            font-size: 13px;
        }


        /* ============================================================
           EMPTY STATE
           ============================================================ */

        .empty-state {
            min-height: 240px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 40px 20px;

            text-align: center;
        }

        .empty-state-icon {
            width: 48px;
            height: 48px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 13px;

            border-radius: 14px;

            background: #f1f3f7;
            color: #7b8496;

            font-size: 19px;
        }

        .empty-state strong {
            color: #4d576a;
            font-size: 15px;
        }

        .empty-state span {
            max-width: 430px;

            margin-top: 7px;

            color: #8a92a3;

            font-size: 12px;
            line-height: 1.6;
        }


        /* ============================================================
           RESPONSIVE
           ============================================================ */

        @media (max-width: 800px) {

            .subscriptions-header {
                align-items: flex-start;
                flex-direction: column;
                gap: 5px;
            }

            .subscriptions-count {
                padding-bottom: 0;
            }

            .subscriptions-toolbar {
                align-items: stretch;
                flex-direction: column;
            }

            .search-box {
                width: 100%;
            }

            .status-filter {
                width: 100%;
            }

        }


        @media (max-width: 600px) {

            .topbar {
                flex-wrap: wrap;
            }

            .topbar-nav {
                width: 100%;
                justify-content: flex-end;
            }

            .nav-button,
            .logout-button {
                min-height: 34px;
                padding: 0 10px;
                font-size: 10px;
            }

        }

    </style>

</head>


<body>


    <!-- ============================================================
         TOPBAR
         ============================================================ -->

    <header class="topbar">

        <div class="topbar-brand">
            Admin Panel
        </div>


        <nav class="topbar-nav">

            <a
                href="admin.html"
                class="nav-button"
            >
                ← Admin Dashboard
            </a>


            <button
                type="button"
                class="logout-button"
                onclick="logout()"
            >
                Logout
            </button>

        </nav>

    </header>



    <!-- ============================================================
         MAIN
         ============================================================ -->

    <main class="dashboard">


        <!-- ==========================================================
             PAGE HEADER
             ========================================================== -->

        <section class="subscriptions-header">

            <div class="welcome">

                <p>
                    Administration
                </p>

                <h1>
                    Subscriptions
                </h1>

            </div>


            <span
                id="subscriptionsCount"
                class="subscriptions-count"
            >
                Loading...
            </span>

        </section>



        <!-- ==========================================================
             TOOLBAR
             ========================================================== -->

        <section class="subscriptions-toolbar">


            <div class="search-box">

                <span
                    class="search-icon"
                    aria-hidden="true"
                >
                    🔍
                </span>


                <input
                    type="search"
                    id="subscriptionSearch"
                    placeholder="Search student, course or subscription ID..."
                    autocomplete="off"
                >

            </div>


            <select
                id="statusFilter"
                class="status-filter"
            >

                <option value="ALL">
                    All Statuses
                </option>

                <option value="ACTIVE">
                    Active
                </option>

                <option value="EXPIRED">
                    Expired
                </option>

            </select>


        </section>



        <!-- ==========================================================
             MESSAGE
             ========================================================== -->

        <div
            id="message"
            class="message"
        ></div>



        <!-- ==========================================================
             SUBSCRIPTIONS
             ========================================================== -->

        <section class="subscriptions-card">

            <div
                id="subscriptions"
                class="table-wrapper"
            >

                <div class="loading">
                    Loading subscriptions...
                </div>

            </div>

        </section>


    </main>



    <!-- ============================================================
         PROJECT JS
         ============================================================ -->

    <script src="js/config.js"></script>

    <script src="js/api.js"></script>

    <script src="js/auth.js"></script>



    <script>

        /* ============================================================
           DATA
           ============================================================ */

        let subscriptions = [];



        /* ============================================================
           FORMAT NUMBER
           ============================================================ */

        function formatNumber(value) {

            return (
                Number(value) || 0
            ).toLocaleString();

        }



        /* ============================================================
           FORMAT DATE
           ============================================================ */

        function formatDate(value) {

            if (!value) {
                return '—';
            }


            const date =
                new Date(value);


            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {
                return '—';
            }


            return date.toLocaleDateString(
                undefined,
                {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric'
                }
            );

        }



        /* ============================================================
           IS EXPIRED
           ============================================================ */

        function isExpired(value) {

            if (!value) {
                return false;
            }


            const date =
                new Date(value);


            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {
                return false;
            }


            return date <
                new Date();

        }



        /* ============================================================
           ESCAPE HTML
           ============================================================ */

        function escapeHtml(value) {

            return String(
                value ?? ''
            )
                .replace(
                    /&/g,
                    '&amp;'
                )
                .replace(
                    /</g,
                    '&lt;'
                )
                .replace(
                    />/g,
                    '&gt;'
                )
                .replace(
                    /"/g,
                    '&quot;'
                )
                .replace(
                    /'/g,
                    '&#039;'
                );

        }



        /* ============================================================
           INITIALS
           ============================================================ */

        function getInitials(name) {

            const text =
                String(
                    name || ''
                ).trim();


            if (!text) {
                return '?';
            }


            const parts =
                text.split(/\s+/);


            if (
                parts.length === 1
            ) {

                return parts[0]
                    .substring(0, 2)
                    .toUpperCase();

            }


            return (
                parts[0][0] +
                parts[parts.length - 1][0]
            ).toUpperCase();

        }



        /* ============================================================
           STATUS HTML
           ============================================================ */

        function statusHtml(status) {

            const value =
                String(
                    status || ''
                )
                    .trim()
                    .toUpperCase();


            let className =
                'status-other';


            if (
                value === 'ACTIVE'
            ) {

                className =
                    'status-active';

            }
            else if (
                value === 'EXPIRED'
            ) {

                className =
                    'status-expired';

            }


            return `

                <span
                    class="status-badge ${className}"
                >

                    <span
                        class="status-dot"
                    ></span>

                    ${escapeHtml(
                        value || 'UNKNOWN'
                    )}

                </span>

            `;

        }



        /* ============================================================
           MESSAGE
           ============================================================ */

        function showMessage(
            text,
            type = 'info'
        ) {

            const element =
                document.getElementById(
                    'message'
                );


            if (!element) {
                return;
            }


            element.textContent =
                text || '';


            element.className =
                'message ' +
                type;


            clearTimeout(
                window.subscriptionMessageTimer
            );


            if (text) {

                window.subscriptionMessageTimer =
                    setTimeout(
                        function() {

                            element.textContent =
                                '';

                            element.className =
                                'message';

                        },
                        3500
                    );

            }

        }



        /* ============================================================
           UPDATE COUNT
           ============================================================ */

        function updateCount(count) {

            document.getElementById(
                'subscriptionsCount'
            ).textContent =
                count +
                (
                    count === 1
                        ? ' subscription'
                        : ' subscriptions'
                );

        }



        /* ============================================================
           LOAD SUBSCRIPTIONS
           ============================================================ */

        async function loadSubscriptions() {

            const container =
                document.getElementById(
                    'subscriptions'
                );


            container.innerHTML = `

                <div class="loading">
                    Loading subscriptions...
                </div>

            `;


            try {

                const result =
                    await apiRequest({

                        action:
                            'getAdminSubscriptions',

                        token:
                            getAuthToken()

                    });


                console.log(
                    'ADMIN SUBSCRIPTIONS:',
                    result
                );


                if (
                    !result ||
                    result.success !== true
                ) {

                    updateCount(0);


                    container.innerHTML = `

                        <div class="empty-state">

                            <div class="empty-state-icon">
                                !
                            </div>

                            <strong>
                                Unable to load subscriptions
                            </strong>

                            <span>
                                ${escapeHtml(
                                    result?.message ||
                                    'Please try again.'
                                )}
                            </span>

                        </div>

                    `;

                    return;

                }


                subscriptions =
                    Array.isArray(
                        result.subscriptions
                    )
                        ? result.subscriptions
                        : [];


                updateCount(
                    subscriptions.length
                );


                renderSubscriptions(
                    subscriptions
                );

            }
            catch (error) {

                console.error(
                    'Load subscriptions error:',
                    error
                );


                updateCount(0);


                container.innerHTML = `

                    <div class="empty-state">

                        <div class="empty-state-icon">
                            !
                        </div>

                        <strong>
                            Unable to load subscriptions
                        </strong>

                        <span>
                            ${escapeHtml(
                                error.message ||
                                'Please refresh the page and try again.'
                            )}
                        </span>

                    </div>

                `;

            }

        }



        /* ============================================================
           FILTER
           ============================================================ */

        function getFilteredSubscriptions() {

            const search =
                String(
                    document.getElementById(
                        'subscriptionSearch'
                    ).value || ''
                )
                    .trim()
                    .toLowerCase();


            const selectedStatus =
                String(
                    document.getElementById(
                        'statusFilter'
                    ).value || 'ALL'
                )
                    .trim()
                    .toUpperCase();


            return subscriptions.filter(
                function(item) {

                    const searchable = [

                        item.subscriptionId,

                        item.studentId,

                        item.studentName,

                        item.studentEmail,

                        item.courseId,

                        item.courseName,

                        item.status

                    ]
                        .map(
                            function(value) {

                                return String(
                                    value || ''
                                ).toLowerCase();

                            }
                        )
                        .join(' ');


                    const matchesSearch =
                        !search ||
                        searchable.includes(
                            search
                        );


                    const itemStatus =
                        String(
                            item.status || ''
                        )
                            .trim()
                            .toUpperCase();


                    const matchesStatus =
                        selectedStatus === 'ALL' ||
                        itemStatus ===
                            selectedStatus;


                    return (
                        matchesSearch &&
                        matchesStatus
                    );

                }
            );

        }



        /* ============================================================
           RENDER SUBSCRIPTIONS
           ============================================================ */

        function renderSubscriptions(list) {

            const container =
                document.getElementById(
                    'subscriptions'
                );


            if (
                !Array.isArray(list) ||
                list.length === 0
            ) {

                container.innerHTML = `

                    <div class="empty-state">

                        <div class="empty-state-icon">
                            📚
                        </div>

                        <strong>
                            No subscriptions found
                        </strong>

                        <span>
                            No subscriptions match your current search or filter.
                        </span>

                    </div>

                `;

                return;

            }


            let html = `

                <table
                    class="subscriptions-table"
                >

                    <thead>

                        <tr>

                            <th>
                                Subscription
                            </th>

                            <th>
                                Student
                            </th>

                            <th>
                                Course
                            </th>

                            <th>
                                Start Date
                            </th>

                            <th>
                                End Date
                            </th>

                            <th>
                                Monthly Fee
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                Created
                            </th>

                            <th>
                                Action
                            </th>

                        </tr>

                    </thead>

                    <tbody>

            `;


            list.forEach(
                function(item) {

                    const expired =
                        isExpired(
                            item.endDate
                        );


                    const status =
                        String(
                            item.status || ''
                        )
                            .trim()
                            .toUpperCase();


                    const endDateClass =
                        expired &&
                        status === 'ACTIVE'
                            ? 'date-expired'
                            : 'date-text';


                    const subscriptionId =
                        String(
                            item.subscriptionId || ''
                        );


                    html += `

                        <tr>


                            <!-- SUBSCRIPTION -->

                            <td>

                                <span
                                    class="subscription-id"
                                >

                                    ${escapeHtml(
                                        subscriptionId
                                    )}

                                </span>

                            </td>



                            <!-- STUDENT -->

                            <td>

                                <div
                                    class="student-cell"
                                >

                                    <div
                                        class="student-avatar"
                                    >

                                        ${escapeHtml(
                                            getInitials(
                                                item.studentName
                                            )
                                        )}

                                    </div>


                                    <div>

                                        <span
                                            class="student-name"
                                        >

                                            ${escapeHtml(
                                                item.studentName ||
                                                'Unknown Student'
                                            )}

                                        </span>


                                        <span
                                            class="student-id"
                                        >

                                            ${escapeHtml(
                                                item.studentId ||
                                                ''
                                            )}

                                        </span>

                                    </div>

                                </div>

                            </td>



                            <!-- COURSE -->

                            <td>

                                <span
                                    class="course-name"
                                    title="${escapeHtml(
                                        item.courseName || ''
                                    )}"
                                >

                                    ${escapeHtml(
                                        item.courseName ||
                                        'Unknown Course'
                                    )}

                                </span>


                                <span
                                    class="course-id"
                                >

                                    ${escapeHtml(
                                        item.courseId ||
                                        ''
                                    )}

                                </span>

                            </td>



                            <!-- START DATE -->

                            <td>

                                <span
                                    class="date-text"
                                >

                                    ${escapeHtml(
                                        formatDate(
                                            item.startDate
                                        )
                                    )}

                                </span>

                            </td>



                            <!-- END DATE -->

                            <td>

                                <span
                                    class="${endDateClass}"
                                >

                                    ${escapeHtml(
                                        formatDate(
                                            item.endDate
                                        )
                                    )}

                                </span>

                            </td>



                            <!-- FEE -->

                            <td>

                                <strong
                                    class="fee"
                                >

                                    ${formatNumber(
                                        item.monthlyFee
                                    )}

                                </strong>


                                <span
                                    class="fee-unit"
                                >

                                    credits

                                </span>

                            </td>



                            <!-- STATUS -->

                            <td>

                                ${statusHtml(
                                    item.status
                                )}

                            </td>



                            <!-- CREATED -->

                            <td>

                                <span
                                    class="date-text"
                                >

                                    ${escapeHtml(
                                        formatDate(
                                            item.createdAt
                                        )
                                    )}

                                </span>

                            </td>



                            <!-- ACTION -->

                            <td>

                                <button
                                    type="button"
                                    class="status-update-button"
                                    data-subscription-id="${escapeHtml(
                                        subscriptionId
                                    )}"
                                    onclick="updateSubscriptionStatus(this)"
                                >

                                    Update Status

                                </button>

                            </td>


                        </tr>

                    `;

                }
            );


            html += `

                    </tbody>

                </table>

            `;


            container.innerHTML =
                html;

        }



        /* ============================================================
           UPDATE SUBSCRIPTION STATUS
           ============================================================ */

        async function updateSubscriptionStatus(
            button
        ) {

            if (!button) {
                return;
            }


            const subscriptionId =
                button.dataset.subscriptionId ||
                '';


            if (!subscriptionId) {

                showMessage(
                    'Subscription ID is missing.',
                    'error'
                );

                return;

            }


            const subscription =
                subscriptions.find(
                    function(item) {

                        return String(
                            item.subscriptionId || ''
                        ).trim() ===
                        String(
                            subscriptionId
                        ).trim();

                    }
                );


            if (!subscription) {

                showMessage(
                    'Subscription could not be found.',
                    'error'
                );

                return;

            }


            /*
             * Browser calculates the expected result
             * for the confirmation message.
             *
             * Backend performs the actual check.
             */

            const expectedStatus =
                isExpired(
                    subscription.endDate
                )
                    ? 'EXPIRED'
                    : 'ACTIVE';


            const confirmed =
                window.confirm(

                    'Update subscription status?\n\n' +

                    'Subscription: ' +
                    subscriptionId +
                    '\n\n' +

                    'End Date: ' +
                    formatDate(
                        subscription.endDate
                    ) +
                    '\n\n' +

                    'New Status: ' +
                    expectedStatus

                );


            if (!confirmed) {
                return;
            }


            button.disabled =
                true;

            button.textContent =
                'Updating...';


            try {

                const result =
                    await apiRequest({

                        action:
                            'updateSubscriptionStatus',

                        token:
                            getAuthToken(),

                        subscriptionId:
                            subscriptionId

                    });


                console.log(
                    'UPDATE STATUS RESPONSE:',
                    result
                );


                if (
                    !result ||
                    result.success !== true
                ) {

                    throw new Error(
                        result?.message ||
                        'Unable to update subscription status.'
                    );

                }


                /*
                 * Update local copy
                 */

                subscription.status =
                    result.status ||
                    expectedStatus;


                /*
                 * Re-render table
                 */

                applyFilters();


                showMessage(
                    'Subscription ' +
                    subscriptionId +
                    ' updated to ' +
                    subscription.status +
                    '.',
                    'success'
                );

            }
            catch (error) {

                console.error(
                    'Update subscription status error:',
                    error
                );


                button.disabled =
                    false;

                button.textContent =
                    'Update Status';


                showMessage(
                    error.message ||
                    'Unable to update subscription status.',
                    'error'
                );

            }

        }



        /* ============================================================
           APPLY FILTERS
           ============================================================ */

        function applyFilters() {

            const filtered =
                getFilteredSubscriptions();


            updateCount(
                filtered.length
            );


            renderSubscriptions(
                filtered
            );

        }



        /* ============================================================
           SEARCH
           ============================================================ */

        document.getElementById(
            'subscriptionSearch'
        )
            .addEventListener(
                'input',
                applyFilters
            );



        /* ============================================================
           STATUS FILTER
           ============================================================ */

        document.getElementById(
            'statusFilter'
        )
            .addEventListener(
                'change',
                applyFilters
            );



        /* ============================================================
           INITIALIZE
           ============================================================ */

        async function initialize() {

            try {

                const user =
                    await requireLogin();


                if (!user) {
                    return;
                }


                /*
                 * ADMIN ONLY
                 */

                if (
                    String(
                        user.role || ''
                    )
                        .trim()
                        .toUpperCase() !==
                    'ADMIN'
                ) {

                    window.location.href =
                        'dashboard.html';

                    return;

                }


                await loadSubscriptions();

            }
            catch (error) {

                console.error(
                    'Initialize error:',
                    error
                );


                document.getElementById(
                    'subscriptions'
                ).innerHTML = `

                    <div class="empty-state">

                        <div class="empty-state-icon">
                            !
                        </div>

                        <strong>
                            Unable to initialize page
                        </strong>

                        <span>
                            ${escapeHtml(
                                error.message ||
                                'Please refresh the page and try again.'
                            )}
                        </span>

                    </div>

                `;

            }

        }



        /* ============================================================
           START
           ============================================================ */

        initialize();

    </script>


</body>

</html>
