<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Payment Requests | Admin
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>
      
        /* ============================================================
           Navigation
        ============================================================ */


        .logout-button {
            border: 0;
            border-radius: 9px;

            padding: 9px 15px;

            font-size: 13px;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                background 0.15s ease;
        }


        .logout-button {
            background: #f1f3f6;
            color: #505866;
        }


        .logout-button:hover {
            background: #e7e9ed;
            transform: translateY(-1px);
        }


        
        
        .topbar-nav {
            display: flex;
            align-items: center;
            gap: 12px;
        }


        .nav-button {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            padding: 9px 16px;

            border: 0;

            border-radius: 8px;

            background: #ffffff;

            color: #1f2937;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition:
                background .2s ease,
                transform .2s ease;

        }


        .nav-button:hover {

            background: #f3f4f6;

            transform:
                translateY(-1px);

        }


        /* ============================================================
           PAYMENT LIST
           ============================================================ */

        .payment-list {

            display: grid;

            gap: 20px;

        }


        .payment-card {

            overflow: hidden;

            border:
                1px solid #e5e8ee;

            border-radius: 20px;

            background: #ffffff;

            box-shadow:
                0 8px 28px
                rgba(20, 30, 50, .06);

        }


        .payment-info {

            padding: 24px;

        }


        /* ============================================================
           PAYMENT HEADER
           ============================================================ */

        .payment-header {

            display: flex;

            align-items: flex-start;

            justify-content: space-between;

            gap: 20px;

            margin-bottom: 22px;

        }


        .payment-id {

            display: inline-block;

            margin-bottom: 7px;

            color: #7b8496;

            font-size: 12px;

            font-weight: 600;

            letter-spacing: .04em;

        }


        .payment-header h2 {

            margin: 0;

            color: #172033;

            font-size: 20px;

        }


        .payment-header p {

            margin: 5px 0 0;

            color: #7b8496;

            font-size: 13px;

        }


        .payment-status {

            flex-shrink: 0;

            padding: 7px 11px;

            border-radius: 999px;

            background:
                rgba(230, 161, 0, .12);

            color: #9a6800;

            font-size: 11px;

            font-weight: 700;

            letter-spacing: .04em;

        }


        /* ============================================================
           PAYMENT DETAILS
           ============================================================ */

        .payment-details {

            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 14px;

        }


        .payment-detail {

            padding: 15px;

            border-radius: 12px;

            background: #f7f8fa;

        }


        .payment-detail-label {

            display: block;

            margin-bottom: 6px;

            color: #7b8496;

            font-size: 12px;

        }


        .payment-detail-value {

            display: block;

            color: #172033;

            font-size: 16px;

            font-weight: 700;

        }


        .credit-value {

            color: #1c4fd7;

        }


        /* ============================================================
           DATE
           ============================================================ */

        .payment-date {

            margin-top: 17px;

            color: #8a92a3;

            font-size: 12px;

        }


        /* ============================================================
           ACTIONS
           ============================================================ */

        .payment-actions {

            display: flex;

            flex-wrap: wrap;

            gap: 10px;

            margin-top: 20px;

            padding-top: 20px;

            border-top:
                1px solid #edf0f4;

        }


        .payment-actions button {

            min-width: 125px;

            padding: 11px 17px;

            border: 0;

            border-radius: 9px;

            font-size: 13px;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform .2s ease,
                opacity .2s ease;

        }


        .payment-actions button:hover {

            transform:
                translateY(-1px);

        }


        .payment-actions button:disabled {

            opacity: .55;

            cursor: not-allowed;

            transform: none;

        }


        .secondary-button {

            background: #eef1f6;

            color: #344054;

        }


        .approve-button {

            background: #188050;

            color: #ffffff;

        }


        .reject-button {

            background: #c0392b;

            color: #ffffff;

        }


        /* ============================================================
           EMPTY STATE
           ============================================================ */

        .empty-state {

            min-height: 180px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            padding: 35px;

            border:
                1px dashed #d6dbe5;

            border-radius: 18px;

            background: #fafbfc;

            text-align: center;

        }


        .empty-state strong {

            color: #4d576a;

            font-size: 16px;

        }


        .empty-state span {

            margin-top: 7px;

            color: #8a92a3;

            font-size: 13px;

        }


        .loading {

            min-height: 150px;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #7b8496;

            font-size: 14px;

        }


        /* ============================================================
           MESSAGE
           ============================================================ */

        #message {

            margin-bottom: 18px;

        }


        /* ============================================================
           RECEIPT VIEWER
           ============================================================ */

        .receipt-modal {

            position: fixed;

            inset: 0;

            z-index: 9999;

            display: none;

            align-items: center;

            justify-content: center;

            padding: 25px;

            background:
                rgba(10, 15, 25, .86);

        }


        .receipt-modal.open {

            display: flex;

        }


        .receipt-container {

            position: relative;

            width: min(900px, 96vw);

            height: min(90vh, 800px);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 60px 20px 20px;

            border-radius: 16px;

            background: #ffffff;

            box-shadow:
                0 25px 80px
                rgba(0, 0, 0, .35);

        }


        .receipt-header {

            position: absolute;

            top: 0;

            left: 0;

            right: 0;

            height: 55px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            padding:
                0 16px 0 20px;

            border-bottom:
                1px solid #e5e7eb;

        }


        .receipt-title {

            overflow: hidden;

            color: #172033;

            font-size: 14px;

            font-weight: 700;

            text-overflow: ellipsis;

            white-space: nowrap;

        }


        .receipt-close {

            flex-shrink: 0;

            padding: 7px 12px;

            border: 0;

            border-radius: 7px;

            background: #172033;

            color: #ffffff;

            cursor: pointer;

            font-size: 12px;

            font-weight: 600;

        }


        .receipt-content {

            width: 100%;

            height: 100%;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: auto;

        }


        .receipt-content img {

            display: block;

            max-width: 100%;

            max-height: 100%;

            width: auto;

            height: auto;

            object-fit: contain;

        }


        .receipt-content iframe {

            width: 100%;

            height: 100%;

            border: 0;

        }


        .receipt-loading {

            color: #7b8496;

            font-size: 14px;

        }


        .receipt-error {

            color: #c0392b;

            font-size: 14px;

            text-align: center;

        }


        /* ============================================================
           RESPONSIVE
           ============================================================ */

        @media (max-width: 800px) {

            .payment-details {

                grid-template-columns:
                    1fr;

            }

        }


        @media (max-width: 600px) {

            .topbar {

                gap: 10px;

            }


            .topbar-nav {

                gap: 6px;

            }


            .nav-button {

                padding:
                    8px 10px;

                font-size: 12px;

            }


            .payment-info {

                padding: 18px;

            }


            .payment-header {

                flex-direction: column;

                gap: 12px;

            }


            .payment-actions {

                flex-direction: column;

            }


            .payment-actions button {

                width: 100%;

            }


            .receipt-modal {

                padding: 10px;

            }


            .receipt-container {

                width: 100%;

                height: 95vh;

                padding:
                    55px 10px 10px;

            }

        }

    </style>

</head>


<body>


<!-- ================================================================
     TOP BAR
     ================================================================ -->

<header class="topbar">


    <div class="topbar-brand">

        Admin Panel

    </div>


    <nav class="topbar-nav">


        <a
            href="admin.html"
            class="nav-button"
        >

            ← Admin Dashboard

        </a>


        <button
            class="logout-button"
            onclick="logout()"
        >

            Logout

        </button>


    </nav>


</header>



<!-- ================================================================
     MAIN CONTENT
     ================================================================ -->

<main class="dashboard">


    <!-- ============================================================
         PAGE HEADING
         ============================================================ -->

    <section class="welcome">


        <p>
            Administration
        </p>


        <h1>
            Payment Requests
        </h1>


    </section>



    <!-- ============================================================
         MESSAGE
         ============================================================ -->

    <div
        id="message"
        class="message"
    ></div>



    <!-- ============================================================
         PAYMENTS
         ============================================================ -->

    <section
        id="payments"
        class="payment-list"
    >

        <div class="loading">

            Loading payment requests...

        </div>

    </section>


</main>



<!-- ================================================================
     RECEIPT MODAL
     ================================================================ -->

<div
    id="receiptModal"
    class="receipt-modal"
>


    <div
        class="receipt-container"
    >


        <div class="receipt-header">


            <div
                id="receiptTitle"
                class="receipt-title"
            >
                Payment Receipt
            </div>


            <button
                class="receipt-close"
                onclick="closeReceipt()"
            >

                Close

            </button>


        </div>


        <div
            id="receiptContent"
            class="receipt-content"
        >

            <div class="receipt-loading">

                Loading receipt...

            </div>

        </div>


    </div>


</div>



<!-- ================================================================
     JAVASCRIPT FILES
     ================================================================ -->

<script src="js/config.js"></script>

<script src="js/api.js"></script>

<script src="js/auth.js"></script>



<script>

/* ================================================================
   ADMIN PAYMENT REQUESTS
   Created by Tr. Sun
   ================================================================ */


let currentPayments = [];



/* ================================================================
   FORMAT MONEY
   ================================================================ */

function formatMoney(
    amount
) {

    return (
        Number(
            amount
        ) || 0
    )
    .toLocaleString();

}



/* ================================================================
   ESCAPE HTML
   ================================================================ */

function escapeHtml(
    value
) {

    return String(
        value ?? ''
    )
    .replace(
        /&/g,
        '&amp;'
    )
    .replace(
        /</g,
        '&lt;'
    )
    .replace(
        />/g,
        '&gt;'
    )
    .replace(
        /"/g,
        '&quot;'
    )
    .replace(
        /'/g,
        '&#039;'
    );

}



/* ================================================================
   ESCAPE JAVASCRIPT
   ================================================================ */

function escapeJs(
    value
) {

    return String(
        value ?? ''
    )
    .replace(
        /\\/g,
        '\\\\'
    )
    .replace(
        /'/g,
        "\\'"
    )
    .replace(
        /"/g,
        '\\"'
    )
    .replace(
        /\r/g,
        '\\r'
    )
    .replace(
        /\n/g,
        '\\n'
    );

}



/* ================================================================
   LOAD PAYMENTS
   ================================================================ */

async function loadPayments() {

    const container =
        document.getElementById(
            'payments'
        );


    container.innerHTML = `

        <div class="loading">

            Loading payment requests...

        </div>

    `;


    try {

        const result =
            await apiRequest({

                action:
                    'getPendingPayments',

                token:
                    getAuthToken()

            });


        if (
            !result ||
            !result.success
        ) {

            container.innerHTML = `

                <div class="empty-state">

                    <strong>
                        Unable to load payments
                    </strong>

                    <span>
                        ${
                            escapeHtml(
                                result?.message ||
                                'Please try again.'
                            )
                        }
                    </span>

                </div>

            `;

            return;

        }


        currentPayments =
            Array.isArray(
                result.payments
            )
                ? result.payments
                : [];


        if (
            currentPayments.length === 0
        ) {

            container.innerHTML = `

                <div class="empty-state">

                    <strong>
                        No pending payments
                    </strong>

                    <span>
                        New payment requests will appear here.
                    </span>

                </div>

            `;

            return;

        }


        container.innerHTML =
            '';


        currentPayments.forEach(
            function(payment) {

                renderPayment(
                    payment,
                    container
                );

            }
        );


    } catch (error) {

        console.error(
            'Load payments error:',
            error
        );


        container.innerHTML = `

            <div class="empty-state">

                <strong>
                    Unable to load payment requests
                </strong>

                <span>
                    Please refresh the page and try again.
                </span>

            </div>

        `;

    }

}



/* ================================================================
   RENDER PAYMENT
   ================================================================ */

function renderPayment(
    payment,
    container
) {

    const card =
        document.createElement(
            'article'
        );


    card.className =
        'payment-card';


    const submitted =
        payment.submittedAt
            ? new Date(
                payment.submittedAt
            ).toLocaleString()
            : 'Unknown';


    /*
     * 1 MMK = 1 Credit
     */

    const credits =
        Number(
            payment.credits ??
            payment.amount ??
            0
        );


    card.innerHTML = `

        <div class="payment-info">


            <!-- ======================================================
                 HEADER
                 ====================================================== -->

            <div class="payment-header">


                <div>


                    <span class="payment-id">

                        ${escapeHtml(
                            payment.paymentId
                        )}

                    </span>


                    <h2>

                        ${escapeHtml(
                            payment.studentName ||
                            'Unknown Student'
                        )}

                    </h2>


                    <p>

                        ${escapeHtml(
                            payment.studentEmail ||
                            ''
                        )}

                    </p>


                </div>


                <span class="payment-status">

                    PENDING

                </span>


            </div>



            <!-- ======================================================
                 PAYMENT DETAILS
                 Package removed.
                 ====================================================== -->

            <div class="payment-details">


                <div class="payment-detail">

                    <span
                        class="payment-detail-label"
                    >
                        Credits
                    </span>


                    <strong
                        class="payment-detail-value credit-value"
                    >

                        ${formatMoney(
                            credits
                        )}

                    </strong>

                </div>



                <div class="payment-detail">

                    <span
                        class="payment-detail-label"
                    >
                        Amount
                    </span>


                    <strong
                        class="payment-detail-value"
                    >

                        ${formatMoney(
                            payment.amount
                        )}
                        MMK

                    </strong>

                </div>



                <div class="payment-detail">

                    <span
                        class="payment-detail-label"
                    >
                        Payment Method
                    </span>


                    <strong
                        class="payment-detail-value"
                    >

                        ${escapeHtml(
                            payment.paymentMethod ||
                            'Unknown'
                        )}

                    </strong>

                </div>


            </div>



            <!-- ======================================================
                 DATE
                 ====================================================== -->

            <div class="payment-date">

                Submitted:

                ${escapeHtml(
                    submitted
                )}

            </div>



            <!-- ======================================================
                 ACTIONS
                 ====================================================== -->

            <div class="payment-actions">


                <button
                    type="button"
                    class="secondary-button"
                    onclick="viewReceipt(
                        '${escapeJs(
                            payment.paymentId
                        )}',
                        this
                    )"
                >

                    View Receipt

                </button>



                <button
                    type="button"
                    class="approve-button"
                    onclick="approve(
                        '${escapeJs(
                            payment.paymentId
                        )}',
                        this
                    )"
                >

                    Approve

                </button>



                <button
                    type="button"
                    class="reject-button"
                    onclick="reject(
                        '${escapeJs(
                            payment.paymentId
                        )}',
                        this
                    )"
                >

                    Reject

                </button>


            </div>


        </div>

    `;


    container.appendChild(
        card
    );

}



/* ================================================================
   VIEW RECEIPT
   ================================================================ */

async function viewReceipt(
    paymentId,
    button
) {

    const payment =
        currentPayments.find(
            function(item) {

                return String(
                    item.paymentId
                ) ===
                String(
                    paymentId
                );

            }
        );


    if (!payment) {

        alert(
            'Payment not found.'
        );

        return;

    }


    if (
        !payment.receiptFileId
    ) {

        alert(
            'Receipt file not found.'
        );

        return;

    }


    const modal =
        document.getElementById(
            'receiptModal'
        );


    const title =
        document.getElementById(
            'receiptTitle'
        );


    const content =
        document.getElementById(
            'receiptContent'
        );


    if (button) {

        button.disabled =
            true;

        button.textContent =
            'Loading...';

    }


    modal.classList.add(
        'open'
    );


    title.textContent =
        payment.receiptFileName ||
        'Payment Receipt';


    content.innerHTML = `

        <div class="receipt-loading">

            Loading receipt...

        </div>

    `;


    try {

        const result =
            await apiRequest({

                action:
                    'getPaymentReceipt',

                token:
                    getAuthToken(),

                paymentId:
                    paymentId

            });


        if (
            !result ||
            !result.success
        ) {

            throw new Error(
                result?.message ||
                'Unable to load receipt.'
            );

        }


        if (
            !result.dataUrl
        ) {

            throw new Error(
                'Receipt data was not returned.'
            );

        }


        /*
         * ------------------------------------------------------------
         * Display image receipt
         * ------------------------------------------------------------
         */

        if (
            String(
                result.mimeType ||
                ''
            )
            .startsWith(
                'image/'
            )
        ) {

            const image =
                document.createElement(
                    'img'
                );


            image.src =
                result.dataUrl;


            image.alt =
                'Payment Receipt';


            image.onload =
                function() {

                    content.innerHTML =
                        '';

                    content.appendChild(
                        image
                    );

                };


            image.onerror =
                function() {

                    content.innerHTML = `

                        <div class="receipt-error">

                            Unable to display this receipt.

                        </div>

                    `;

                };


        } else {


            /*
             * --------------------------------------------------------
             * PDF / other supported file
             * --------------------------------------------------------
             */

            const iframe =
                document.createElement(
                    'iframe'
                );


            iframe.src =
                result.dataUrl;


            iframe.title =
                'Payment Receipt';


            content.innerHTML =
                '';


            content.appendChild(
                iframe
            );

        }


    } catch (error) {

        console.error(
            'View receipt error:',
            error
        );


        content.innerHTML = `

            <div class="receipt-error">

                ${
                    escapeHtml(
                        error.message ||
                        'Unable to load receipt.'
                    )
                }

            </div>

        `;

    } finally {

        if (button) {

            button.disabled =
                false;

            button.textContent =
                'View Receipt';

        }

    }

}



/* ================================================================
   CLOSE RECEIPT
   ================================================================ */

function closeReceipt() {

    const modal =
        document.getElementById(
            'receiptModal'
        );


    modal.classList.remove(
        'open'
    );


    document.getElementById(
        'receiptContent'
    ).innerHTML = `

        <div class="receipt-loading">

            Loading receipt...

        </div>

    `;

}



/* ================================================================
   CLOSE RECEIPT WHEN CLICKING OUTSIDE
   ================================================================ */

document.getElementById(
    'receiptModal'
)
.addEventListener(
    'click',
    function(event) {

        if (
            event.target ===
            this
        ) {

            closeReceipt();

        }

    }
);



/* ================================================================
   ESCAPE KEY
   ================================================================ */

document.addEventListener(
    'keydown',
    function(event) {

        if (
            event.key ===
            'Escape'
        ) {

            closeReceipt();

        }

    }
);



/* ================================================================
   APPROVE PAYMENT
   ================================================================ */

async function approve(
    paymentId,
    button
) {

    const confirmed =
        confirm(
            'Approve payment ' +
            paymentId +
            ' and add the credits?'
        );


    if (!confirmed) {

        return;

    }


    const message =
        document.getElementById(
            'message'
        );


    if (button) {

        button.disabled =
            true;

        button.textContent =
            'Approving...';

    }


    message.textContent =
        'Processing approval...';


    try {

        const result =
            await apiRequest({

                action:
                    'approvePayment',

                token:
                    getAuthToken(),

                paymentId:
                    paymentId

            });


        if (
            !result ||
            !result.success
        ) {

            message.textContent =
                result?.message ||
                'Unable to approve payment.';

            return;

        }


        message.textContent =
            'Payment approved. ' +
            Number(
                result.creditsAdded || 0
            ).toLocaleString() +
            ' credits added.';


        await loadPayments();


    } catch (error) {

        console.error(
            'Approve payment error:',
            error
        );


        message.textContent =
            'Unable to approve payment.';

    } finally {

        if (button) {

            button.disabled =
                false;

            button.textContent =
                'Approve';

        }

    }

}



/* ================================================================
   REJECT PAYMENT
   ================================================================ */

async function reject(
    paymentId,
    button
) {

    const confirmed =
        confirm(
            'Reject payment ' +
            paymentId +
            '?'
        );


    if (!confirmed) {

        return;

    }


    const note =
        prompt(
            'Reason for rejection (optional):'
        );


    const message =
        document.getElementById(
            'message'
        );


    if (button) {

        button.disabled =
            true;

        button.textContent =
            'Rejecting...';

    }


    message.textContent =
        'Processing rejection...';


    try {

        const result =
            await apiRequest({

                action:
                    'rejectPayment',

                token:
                    getAuthToken(),

                paymentId:
                    paymentId,

                adminNote:
                    note || ''

            });


        if (
            !result ||
            !result.success
        ) {

            message.textContent =
                result?.message ||
                'Unable to reject payment.';

            return;

        }


        message.textContent =
            'Payment rejected.';


        await loadPayments();


    } catch (error) {

        console.error(
            'Reject payment error:',
            error
        );


        message.textContent =
            'Unable to reject payment.';

    } finally {

        if (button) {

            button.disabled =
                false;

            button.textContent =
                'Reject';

        }

    }

}



/* ================================================================
   INITIALIZE
   ================================================================ */

async function initialize() {

    try {

        const user =
            await requireLogin();


        if (!user) {

            return;

        }


        if (
            String(
                user.role ||
                ''
            )
            .trim()
            .toUpperCase() !==
            'ADMIN'
        ) {

            window.location.href =
                'dashboard.html';

            return;

        }


        await loadPayments();


    } catch (error) {

        console.error(
            'Initialize payment page error:',
            error
        );


        document.getElementById(
            'payments'
        ).innerHTML = `

            <div class="empty-state">

                <strong>
                    Unable to initialize payment requests
                </strong>

                <span>
                    Please refresh the page and try again.
                </span>

            </div>

        `;

    }

}



/* ================================================================
   START
   ================================================================ */

initialize();

</script>
