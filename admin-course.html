<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Course Details | Admin</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        /* ============================================================
           Navigation
        ============================================================ */


        .logout-button {
            border: 0;
            border-radius: 9px;

            padding: 9px 15px;

            font-size: 13px;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                background 0.15s ease;
        }


        .logout-button {
            background: #f1f3f6;
            color: #505866;
        }


        .logout-button:hover {
            background: #e7e9ed;
            transform: translateY(-1px);
        }


        .topbar-nav {
            display: flex;
            align-items: center;
            gap: 10px;
        }


        .nav-button {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            padding: 9px 15px;

            border-radius: 8px;

            background: #ffffff;

            color: #172033;

            text-decoration: none;

            font-size: 13px;

            font-weight: 600;

            transition:
                background .2s ease,
                transform .2s ease;

        }


        .nav-button:hover {

            background: #f1f3f6;

            transform:
                translateY(-1px);

        }


        /* ============================================================
           ADMIN COURSE PAGE
           ============================================================ */

        .admin-course-page {
            max-width: 1250px;
            margin: 0 auto;
            padding: 30px 20px 60px;
        }


        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 25px;
        }


        .page-header-left h1 {
            margin: 0;
            color: #172033;
            font-size: 26px;
        }


        .page-header-left p {
            margin: 6px 0 0;
            color: #7b8496;
            font-size: 13px;
        }


        .page-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }


        .admin-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 38px;
            padding: 0 15px;
            border: 0;
            border-radius: 9px;
            background: #172033;
            color: #fff;
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }


        .admin-btn:hover {
            background: #29354c;
        }


        .admin-btn-light {
            background: #f1f3f7;
            color: #344054;
        }


        .admin-btn-light:hover {
            background: #e7eaf0;
        }


        /* ============================================================
           COURSE HEADER
           ============================================================ */

        .course-card {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 25px;
            margin-bottom: 25px;
            padding: 22px;
            border: 1px solid #e5e8ee;
            border-radius: 18px;
            background: #fff;
            box-shadow:
                0 8px 28px rgba(20, 30, 50, .06);
        }


        .course-cover {
            position: relative;
            min-height: 230px;
            overflow: hidden;
            border-radius: 14px;
            background: #f1f3f7;
        }


        .course-cover img {
            width: 100%;
            height: 100%;
            min-height: 230px;
            display: block;
            object-fit: cover;
        }


        .course-cover-placeholder {
            min-height: 230px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
            color: #98a2b3;
        }


        .course-cover-status {
            position: absolute;
            top: 14px;
            right: 14px;
        }


        .course-details {
            padding: 8px 5px;
        }


        .course-id {
            margin-bottom: 7px;
            color: #98a2b3;
            font-family: monospace;
            font-size: 11px;
        }


        .course-name {
            margin: 0;
            color: #172033;
            font-size: 29px;
            line-height: 1.25;
        }


        .course-description {
            margin: 14px 0 22px;
            color: #687386;
            font-size: 14px;
            line-height: 1.7;
        }


        .course-meta {
            display: grid;
            grid-template-columns:
                repeat(3, 1fr);
            gap: 12px;
        }


        .meta-box {
            padding: 14px;
            border-radius: 11px;
            background: #f7f8fa;
        }


        .meta-box span {
            display: block;
            margin-bottom: 6px;
            color: #8a92a3;
            font-size: 10px;
            text-transform: uppercase;
        }


        .meta-box strong {
            color: #344054;
            font-size: 14px;
        }


        .fee {
            color: #3157d5 !important;
        }


        /* ============================================================
           STATUS
           ============================================================ */

        .status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 700;
        }


        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }


        .status-active {
            color: #17764c;
            background: rgba(24, 128, 80, .10);
        }


        .status-active .status-dot {
            background: #188050;
        }


        .status-inactive {
            color: #b52f23;
            background: rgba(192, 57, 43, .10);
        }


        .status-inactive .status-dot {
            background: #c0392b;
        }


        .status-other {
            color: #667085;
            background: #eef1f5;
        }


        .status-other .status-dot {
            background: #98a2b3;
        }


        /* ============================================================
           STATISTICS
           ============================================================ */

        .stats {
            display: grid;
            grid-template-columns:
                repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }


        .stat {
            padding: 19px;
            border: 1px solid #e5e8ee;
            border-radius: 14px;
            background: #fff;
            box-shadow:
                0 6px 20px rgba(20, 30, 50, .05);
        }


        .stat-label {
            color: #8a92a3;
            font-size: 11px;
        }


        .stat-value {
            display: block;
            margin-top: 6px;
            color: #172033;
            font-size: 25px;
            font-weight: 700;
        }


        /* ============================================================
           SECTION
           ============================================================ */

        .section {
            margin-bottom: 23px;
            overflow: hidden;
            border: 1px solid #e5e8ee;
            border-radius: 17px;
            background: #fff;
            box-shadow:
                0 8px 28px rgba(20, 30, 50, .06);
        }


        .section-header {
            padding: 19px 21px;
            border-bottom: 1px solid #edf0f4;
        }


        .section-header h2 {
            margin: 0;
            color: #172033;
            font-size: 17px;
        }


        .section-header p {
            margin: 5px 0 0;
            color: #8a92a3;
            font-size: 12px;
        }


        /* ============================================================
           TABLE
           ============================================================ */

        .table-scroll {
            overflow-x: auto;
        }


        table {
            width: 100%;
            min-width: 760px;
            border-collapse: collapse;
        }


        th {
            padding: 13px 17px;
            background: #fafbfc;
            border-bottom: 1px solid #edf0f4;
            color: #687386;
            font-size: 10px;
            text-align: left;
            text-transform: uppercase;
        }


        td {
            padding: 14px 17px;
            border-bottom: 1px solid #edf0f4;
            color: #344054;
            font-size: 12px;
        }


        tbody tr:last-child td {
            border-bottom: 0;
        }


        tbody tr:hover {
            background: #fafbfc;
        }


        .student {
            display: flex;
            align-items: center;
            gap: 10px;
        }


        .avatar {
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border-radius: 50%;
            background: #edf2ff;
            color: #4257c8;
            font-size: 10px;
            font-weight: 700;
        }


        .student-name {
            display: block;
            color: #172033;
            font-weight: 700;
        }


        .student-id {
            display: block;
            margin-top: 3px;
            color: #98a2b3;
            font-family: monospace;
            font-size: 9px;
        }


        .action-link {
            display: inline-flex;
            padding: 7px 10px;
            border-radius: 7px;
            background: #172033;
            color: #fff;
            text-decoration: none;
            font-size: 10px;
            font-weight: 700;
        }


        .action-link-light {
            background: #f1f3f7;
            color: #344054;
        }


        /* ============================================================
           LESSONS
           ============================================================ */

        .lesson {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 15px 20px;
            border-bottom: 1px solid #edf0f4;
        }


        .lesson:last-child {
            border-bottom: 0;
        }


        .lesson-number {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border-radius: 10px;
            background: #f0f3ff;
            color: #4257c8;
            font-size: 12px;
            font-weight: 700;
        }


        .lesson-info {
            min-width: 0;
            flex: 1;
        }


        .lesson-title {
            display: block;
            overflow: hidden;
            color: #172033;
            font-size: 13px;
            font-weight: 700;
            text-overflow: ellipsis;
            white-space: nowrap;
        }


        .lesson-id {
            display: block;
            margin-top: 3px;
            color: #98a2b3;
            font-family: monospace;
            font-size: 9px;
        }


        /* ============================================================
           EMPTY / LOADING / ERROR
           ============================================================ */

        .loading {
            padding: 70px 20px;
            color: #7b8496;
            text-align: center;
            font-size: 14px;
        }


        .empty {
            padding: 45px 20px;
            color: #8a92a3;
            text-align: center;
            font-size: 13px;
        }


        .error {
            padding: 25px;
            border: 1px solid #fecaca;
            border-radius: 13px;
            background: #fff5f5;
            color: #b42318;
            font-size: 13px;
            line-height: 1.7;
        }


        .error a {
            color: inherit;
            font-weight: 700;
        }


        /* ============================================================
           RESPONSIVE
           ============================================================ */

        @media (max-width: 850px) {

            .course-card {
                grid-template-columns: 1fr;
            }


            .course-cover {
                min-height: 240px;
            }


            .course-cover img {
                min-height: 240px;
            }


            .course-cover-placeholder {
                min-height: 240px;
            }

        }


        @media (max-width: 650px) {

            .admin-course-page {
                padding:
                    20px 14px 45px;
            }


            .page-header {
                align-items: flex-start;
                flex-direction: column;
            }


            .course-meta {
                grid-template-columns: 1fr;
            }


            .stats {
                grid-template-columns: 1fr;
            }


            .course-name {
                font-size: 24px;
            }

        }
    </style>

</head>


<body>


    <!-- ================================================================
     HEADER
     ================================================================ -->

    <header class="topbar">

        <div class="topbar-brand">
            Admin Panel
        </div>


        <nav class="topbar-nav">

            <a href="admin.html" class="nav-button">
                Dashboard
            </a>


            <a href="admin-courses.html" class="nav-button">
                Courses
            </a>


            <button type="button" class="logout-button" onclick="doLogout()">
                Logout
            </button>

        </nav>

    </header>



    <!-- ================================================================
     PAGE
     ================================================================ -->

    <main class="admin-course-page">


        <div id="pageContent">

            <div class="loading">
                Loading course...
            </div>

        </div>


    </main>



    <!-- ================================================================
     EXISTING PROJECT FILES
     ================================================================ -->

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>



    <script>

        /* ================================================================
           ADMIN COURSE DETAILS
           ================================================================ */


        let courseResult = null;



        /* ================================================================
           GET TOKEN
           ================================================================ */

        function getToken() {

            if (
                typeof getAuthToken === 'function'
            ) {

                return getAuthToken();

            }


            /*
             * Fallback for the existing localStorage
             * if getAuthToken() is unavailable.
             */

            return (
                localStorage.getItem('authToken') ||
                localStorage.getItem('token') ||
                ''
            );

        }



        /* ================================================================
           COURSE ID
           ================================================================ */

        function getCourseId() {

            const params =
                new URLSearchParams(
                    window.location.search
                );


            /*
             * Admin page uses ?id=
             */

            const id =
                params.get('id');


            if (id) {

                return String(id).trim();

            }


            /*
             * Also support ?courseId=
             */

            const courseId =
                params.get('courseId');


            return String(
                courseId || ''
            ).trim();

        }



        /* ================================================================
           ESCAPE HTML
           ================================================================ */

        function escapeHtml(value) {

            return String(
                value ?? ''
            )
                .replace(
                    /&/g,
                    '&amp;'
                )
                .replace(
                    /</g,
                    '&lt;'
                )
                .replace(
                    />/g,
                    '&gt;'
                )
                .replace(
                    /"/g,
                    '&quot;'
                )
                .replace(
                    /'/g,
                    '&#039;'
                );

        }



        /* ================================================================
           FORMAT NUMBER
           ================================================================ */

        function formatNumber(value) {

            return Number(
                value || 0
            ).toLocaleString();

        }



        /* ================================================================
           FORMAT DATE
           ================================================================ */

        function formatDate(value) {

            if (!value) {

                return '—';

            }


            const date =
                new Date(value);


            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {

                return '—';

            }


            return date.toLocaleDateString(
                undefined,
                {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric'
                }
            );

        }



        /* ================================================================
           STATUS
           ================================================================ */

        function statusHtml(value) {

            const status =
                String(
                    value || ''
                )
                    .trim()
                    .toUpperCase();


            let cls =
                'status-other';


            if (
                status === 'ACTIVE'
            ) {

                cls =
                    'status-active';

            }
            else if (
                status === 'INACTIVE' ||
                status === 'DISABLED'
            ) {

                cls =
                    'status-inactive';

            }


            return `

        <span class="status ${cls}">

            <span class="status-dot"></span>

            ${escapeHtml(
                status || 'UNKNOWN'
            )}

        </span>

    `;

        }



        /* ================================================================
           INITIALS
           ================================================================ */

        function initials(name) {

            const value =
                String(
                    name || ''
                ).trim();


            if (!value) {

                return '?';

            }


            const parts =
                value.split(/\s+/);


            if (
                parts.length === 1
            ) {

                return parts[0]
                    .substring(0, 2)
                    .toUpperCase();

            }


            return (
                parts[0][0] +
                parts[parts.length - 1][0]
            ).toUpperCase();

        }



        /* ================================================================
           IMAGE URL
           ================================================================ */

        function imageUrl(value) {

            const valueString =
                String(
                    value || ''
                ).trim();


            if (!valueString) {

                return '';

            }


            /*
             * Google Drive file ID
             */

            if (
                /^[a-zA-Z0-9_-]{20,}$/
                    .test(valueString)
            ) {

                return (
                    'https://drive.google.com/thumbnail?id=' +
                    encodeURIComponent(
                        valueString
                    ) +
                    '&sz=w1200'
                );

            }


            return valueString;

        }



        /* ================================================================
           NORMALIZE COURSE
           ================================================================ */

        function normalizeCourse(course) {

            course =
                course || {};


            return {

                courseId:
                    course.courseId ??
                    course.CourseID ??
                    '',

                courseName:
                    course.courseName ??
                    course.CourseName ??
                    '',

                description:
                    course.description ??
                    course.Description ??
                    '',

                courseImage:
                    course.courseImage ??
                    course.CourseImage ??
                    '',

                monthlyFee:
                    course.monthlyFee ??
                    course.MonthlyFee ??
                    0,

                status:
                    course.status ??
                    course.Status ??
                    ''

            };

        }



        /* ================================================================
           RENDER STUDENTS
           ================================================================ */

        function renderStudents(students) {

            if (
                !Array.isArray(students) ||
                students.length === 0
            ) {

                return `

            <div class="empty">

                No students are currently subscribed
                to this course.

            </div>

        `;

            }


            let html = `

        <div class="table-scroll">

            <table>

                <thead>

                    <tr>

                        <th>Student</th>

                        <th>Email</th>

                        <th>Subscription</th>

                        <th>Start</th>

                        <th>End</th>

                        <th>Status</th>

                        <th>Action</th>

                    </tr>

                </thead>

                <tbody>

    `;


            students.forEach(
                function (student) {

                    const studentId =
                        student.studentId ||
                        student.StudentID ||
                        '';


                    const name =
                        student.name ||
                        student.studentName ||
                        'Unknown Student';


                    html += `

                <tr>

                    <td>

                        <div class="student">

                            <div class="avatar">

                                ${escapeHtml(
                        initials(name)
                    )}

                            </div>


                            <div>

                                <span
                                    class="student-name"
                                >

                                    ${escapeHtml(
                        name
                    )}

                                </span>


                                <span
                                    class="student-id"
                                >

                                    ${escapeHtml(
                        studentId
                    )}

                                </span>

                            </div>

                        </div>

                    </td>


                    <td>

                        ${escapeHtml(
                        student.email ||
                        student.studentEmail ||
                        '—'
                    )}

                    </td>


                    <td>

                        ${escapeHtml(
                        student.subscriptionId ||
                        '—'
                    )}

                    </td>


                    <td>

                        ${escapeHtml(
                        formatDate(
                            student.startDate
                        )
                    )}

                    </td>


                    <td>

                        ${escapeHtml(
                        formatDate(
                            student.endDate
                        )
                    )}

                    </td>


                    <td>

                        ${statusHtml(
                        student.status
                    )}

                    </td>


                    <td>

                        ${studentId
                            ? `

                                    <a
                                        class="action-link"
                                        href="admin-student.html?id=${encodeURIComponent(
                                studentId
                            )}"
                                    >

                                        View

                                    </a>

                                `
                            : '—'
                        }

                    </td>

                </tr>

            `;

                }
            );


            html += `

                </tbody>

            </table>

        </div>

    `;


            return html;

        }



        /* ================================================================
           RENDER LESSONS
           ================================================================ */

        function renderLessons(lessons) {

            if (
                !Array.isArray(lessons) ||
                lessons.length === 0
            ) {

                return `

            <div class="empty">

                No lessons have been added to this course yet.

            </div>

        `;

            }


            let html = '';


            lessons.forEach(
                function (lesson, index) {

                    const lessonId =
                        lesson.lessonId ||
                        lesson.LessonID ||
                        '';


                    const title =
                        lesson.lessonTitle ||
                        lesson.LessonTitle ||
                        lesson.title ||
                        lesson.Title ||
                        'Untitled Lesson';


                    html += `

                <div class="lesson">

                    <div
                        class="lesson-number"
                    >

                        ${index + 1}

                    </div>


                    <div
                        class="lesson-info"
                    >

                        <span
                            class="lesson-title"
                        >

                            ${escapeHtml(
                        title
                    )}

                        </span>


                        <span
                            class="lesson-id"
                        >

                            ${escapeHtml(
                        lessonId ||
                        'No Lesson ID'
                    )}

                        </span>

                    </div>


                    ${lessonId
                            ? `

                                <a
                                    class="action-link action-link-light"
                                    href="admin-lesson.html?id=${encodeURIComponent(
                                lessonId
                            )}"
                                >

                                    View

                                </a>

                            `
                            : ''
                        }

                </div>

            `;

                }
            );


            return html;

        }



        /* ================================================================
           RENDER PAGE
           ================================================================ */

        function renderPage() {

            const course =
                normalizeCourse(
                    courseResult.course
                );


            const students =
                Array.isArray(
                    courseResult.students
                )
                    ? courseResult.students
                    : [];


            const lessons =
                Array.isArray(
                    courseResult.lessons
                )
                    ? courseResult.lessons
                    : [];


            document.title =
                (
                    course.courseName ||
                    'Course Details'
                ) +
                ' | Admin';


            const image =
                imageUrl(
                    course.courseImage
                );


            const coverHtml =
                image

                    ? `

                <img
                    src="${escapeHtml(image)}"
                    alt="${escapeHtml(
                        course.courseName
                    )}"
                    onerror="
                        this.style.display='none';
                        this.nextElementSibling.style.display='flex';
                    "
                >

                <div
                    class="course-cover-placeholder"
                    style="display:none;"
                >
                    📚
                </div>

            `

                    : `

                <div
                    class="course-cover-placeholder"
                >
                    📚
                </div>

            `;


            document.getElementById(
                'pageContent'
            ).innerHTML = `



        <!-- ========================================================
             COURSE
             ======================================================== -->

        <section class="course-card">


            <div class="course-cover">

                ${coverHtml}


                <div
                    class="course-cover-status"
                >

                    ${statusHtml(
                course.status
            )}

                </div>

            </div>



            <div class="course-details">


                <div class="course-id">

                    ${escapeHtml(
                course.courseId
            )}

                </div>


                <h2 class="course-name">

                    ${escapeHtml(
                course.courseName ||
                'Untitled Course'
            )}

                </h2>


                <p class="course-description">

                    ${escapeHtml(
                course.description ||
                'No description available.'
            )}

                </p>


                <div class="course-meta">


                    <div class="meta-box">

                        <span>
                            Monthly Fee
                        </span>

                        <strong class="fee">

                            ${formatNumber(
                course.monthlyFee
            )}
                            credits

                        </strong>

                    </div>


                    <div class="meta-box">

                        <span>
                            Status
                        </span>

                        <strong>

                            ${statusHtml(
                course.status
            )}

                        </strong>

                    </div>


                    <div class="meta-box">

                        <span>
                            Course ID
                        </span>

                        <strong>

                            ${escapeHtml(
                course.courseId
            )}

                        </strong>

                    </div>


                </div>


            </div>


        </section>



        <!-- ========================================================
             STATISTICS
             ======================================================== -->

        <section class="stats">


            <div class="stat">

                <span class="stat-label">
                    Enrolled Students
                </span>


                <strong class="stat-value">

                    ${students.length}

                </strong>

            </div>


            <div class="stat">

                <span class="stat-label">
                    Lessons
                </span>


                <strong class="stat-value">

                    ${lessons.length}

                </strong>

            </div>


            <div class="stat">

                <span class="stat-label">
                    Monthly Fee
                </span>


                <strong class="stat-value">

                    ${formatNumber(
                course.monthlyFee
            )}

                </strong>

            </div>


        </section>



        <!-- ========================================================
             STUDENTS
             ======================================================== -->

        <section class="section">


            <div class="section-header">

                <h2>
                    Enrolled Students
                </h2>


                <p>
                    Students subscribed to this course
                </p>

            </div>


            ${renderStudents(students)}


        </section>



        <!-- ========================================================
             LESSONS
             ======================================================== -->

        <section class="section">


            <div class="section-header">

                <h2>
                    Course Lessons
                </h2>


                <p>
                    Lessons belonging to this course
                </p>

            </div>


            ${renderLessons(lessons)}


        </section>

    `;

        }



        /* ================================================================
           LOAD COURSE
           ================================================================ */

        async function loadCourse() {

            const content =
                document.getElementById(
                    'pageContent'
                );


            const courseId =
                getCourseId();


            if (!courseId) {

                content.innerHTML = `

            <div class="error">

                <strong>
                    Course ID is missing.
                </strong>

                <br><br>

                Open this page from
                <b>Admin → Courses → View Course</b>.

                <br><br>

                <a
                    href="admin-courses.html"
                >
                    ← Back to Courses
                </a>

            </div>

        `;

                return;

            }


            const token =
                getToken();


            if (!token) {

                content.innerHTML = `

            <div class="error">

                Your login session could not be found.

                <br><br>

                <a
                    href="login.html"
                >
                    Login again
                </a>

            </div>

        `;

                return;

            }


            content.innerHTML = `

        <div class="loading">

            Loading course...

        </div>

    `;


            try {

                /*
                 * IMPORTANT:
                 *
                 * This uses the exact backend route
                 * already present in your Codes.gs:
                 *
                 * getAdminCourseDetails
                 */

                const result =
                    await apiRequest({

                        action:
                            'getAdminCourseDetails',

                        token:
                            token,

                        courseId:
                            courseId

                    });


                console.log(
                    'ADMIN COURSE RESPONSE:',
                    result
                );


                if (
                    !result ||
                    result.success !== true
                ) {

                    content.innerHTML = `

                <div class="error">

                    <strong>
                        Unable to load course.
                    </strong>

                    <br><br>

                    ${escapeHtml(
                        result?.message ||
                        'No response from server.'
                    )}

                    <br><br>

                    <a
                        href="admin-courses.html"
                    >

                        ← Back to Courses

                    </a>

                </div>

            `;

                    return;

                }


                if (
                    !result.course
                ) {

                    content.innerHTML = `

                <div class="error">

                    The server returned successfully,
                    but no course information was returned.

                    <br><br>

                    Course ID:
                    <b>
                        ${escapeHtml(courseId)}
                    </b>

                    <br><br>

                    <a
                        href="admin-courses.html"
                    >

                        ← Back to Courses

                    </a>

                </div>

            `;

                    return;

                }


                courseResult =
                    result;


                renderPage();


            }
            catch (error) {

                console.error(
                    'ADMIN COURSE ERROR:',
                    error
                );


                content.innerHTML = `

            <div class="error">

                <strong>
                    Server request failed.
                </strong>

                <br><br>

                ${escapeHtml(
                    error.message ||
                    'Unknown error'
                )}

                <br><br>

                <a
                    href="admin-courses.html"
                >

                    ← Back to Courses

                </a>

            </div>

        `;

            }

        }



        /* ================================================================
           LOGOUT
           ================================================================ */

        function doLogout() {

            try {

                if (
                    typeof logout === 'function'
                ) {

                    logout();

                    return;

                }

            }
            catch (error) {

                console.error(
                    error
                );

            }


            localStorage.removeItem(
                'authToken'
            );

            localStorage.removeItem(
                'token'
            );


            window.location.href =
                'login.html';

        }



        /* ================================================================
           START
           ================================================================ */

        document.addEventListener(
            'DOMContentLoaded',
            function () {

                loadCourse();

            }
        );

    </script>


</body>
