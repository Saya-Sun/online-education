<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Student Learning</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <div class="brand">

                <div class="brand-logo">
                    TS
                </div>

                <h1>
                    Student Learning
                </h1>

                <p>
                    Sign in to continue learning
                </p>

            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        id="email"
                        type="email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        id="password"
                        type="password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="primary-button"
                    id="loginButton"
                >
                    Login
                </button>

            </form>


            <div
                id="loginMessage"
                class="message"
            ></div>


            <p class="auth-footer">

                Don't have an account?

                <a href="register.html">
                    Create account
                </a>

            </p>

        </section>

    </main>


    <script src="js/config.js"></script>

    <script src="js/api.js"></script>

    <script src="js/auth.js"></script>


    <script>

        const loginForm =
            document.getElementById(
                'loginForm'
            );

        const loginButton =
            document.getElementById(
                'loginButton'
            );

        const message =
            document.getElementById(
                'loginMessage'
            );


        loginForm.addEventListener(
            'submit',
            async function(event) {

                event.preventDefault();

                message.textContent = '';

                loginButton.disabled = true;

                loginButton.textContent =
                    'Signing in...';


                try {

                    const result =
                        await apiRequest({

                            action: 'login',

                            email:
                                document
                                .getElementById('email')
                                .value,

                            password:
                                document
                                .getElementById('password')
                                .value

                        });


                    if (!result.success) {

                        message.textContent =
                            result.message;

                        loginButton.disabled =
                            false;

                        loginButton.textContent =
                            'Login';

                        return;
                    }


                    saveSession(result);


                    if (
                        result.user.role ===
                        'ADMIN'
                    ) {

                        window.location.href =
                            'admin.html';

                    } else {

                        window.location.href =
                            'dashboard.html';
                    }


                } catch (error) {

                    message.textContent =
                        'Unable to connect to server.';

                    loginButton.disabled =
                        false;

                    loginButton.textContent =
                        'Login';
                }

            }
        );

    </script>

</body>

</html>
